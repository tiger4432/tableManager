[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "assy_manager"
version = "0.1.0"
description = "Assembly and Table Manager Ingestion Suite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4",
    "watchdog"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]
