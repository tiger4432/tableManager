<!doctype html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- The saved theme stamped before the styles load (theme.js's key). -->
  <script>(function(){try{var t=localStorage.getItem('theme');document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');}catch(e){}})();</script>
  <title>Tables</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>▦</text></svg>" />
  <script type="module" src="/src/account_boot.js"></script>
  <script type="module" src="/src/tables/main.js"></script>
  <style>html, body { height: 100%; margin: 0; }</style>
</head>

<body>
  <div class="tables-page">
    <header class="tables-top">
      <span class="tables-top__title">Tables</span>
      <label for="tables-table" class="tables-box__label">Table</label>
      <select id="tables-table"></select>
      <span id="tables-from" class="tables-top__from" hidden>Opened from grid</span>
      <span class="tables-top__sp"></span>
      <span id="account-badge"></span>
    </header>
    <main id="tables-board" class="tables-board"></main>
  </div>
</body>

</html>
