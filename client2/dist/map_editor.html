<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AssyManager - Grid Map Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/map_editor-BcfvbpBH.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-Dezn_h7o.js">
  <link rel="modulepreload" crossorigin href="/assets/config-bIuxiUZW.js">
  <link rel="stylesheet" crossorigin href="/assets/config-CtF7vYYp.css">
</head>
<body class="dark-theme">
  <div id="app">
    <!-- 헤더 툴바 -->
    <header class="app-header">
      <div class="logo-area">
        <span class="pulse-indicator status-ws"></span>
        <h1>Map Editor</h1>
      </div>
      <div class="controls-area">
        <a href="/index.html" class="glass-btn hover-danger" style="text-decoration: none;">&larr; Back to Grid</a>
      </div>
    </header>

    <main class="main-layout">
      <!-- 좌측 패널: 메타데이터 설정 및 범례 관리 -->
      <aside class="history-sidebar glass-panel" style="width: 350px; min-width: 350px;">
        <div class="sidebar-header">
          <h2>1. Map Metadata</h2>
        </div>
        <div class="sidebar-content" style="display: flex; flex-direction: column; gap: 15px; padding: 15px; overflow-y: auto;">
          <!-- 대상 테이블 선택 -->
          <div class="control-group-vertical">
            <label for="map-table-select">Target Table</label>
            <select id="map-table-select" class="glass-input w-full"></select>
          </div>

          <!-- Product Presets -->
          <div class="control-group-vertical" style="border: 1px dashed rgba(168, 85, 247, 0.3); border-radius: 8px; padding: 10px; background: rgba(168, 85, 247, 0.03);">
            <label for="preset-select" style="color: var(--color-secondary); font-weight: bold; display: flex; align-items: center; justify-content: space-between;">
              Product Presets
              <button id="btn-save-preset" class="glass-page-btn" style="padding: 2px 8px; font-size: 0.75rem; border-color: var(--color-secondary); color: var(--color-secondary);" title="Save current settings as a new custom preset for this table">💾 Save Current</button>
            </label>
            <select id="preset-select" class="glass-input w-full" style="margin-top: 4px;">
              <option value="">-- Select Preset --</option>
              <option value="std_10">Std 10x10 (0°, Front)</option>
              <option value="prod_a">Product A (30x30, 90°, Back)</option>
              <option value="prod_b">Product B (50x50, 180°, Front)</option>
              <option value="prod_c">Product C (60x60, 270°, Back)</option>
            </select>
          </div>
          
          <!-- 동적 메타데이터 입력 영역 -->
          <div id="metadata-fields-container" style="display: flex; flex-direction: column; gap: 10px;">
            <!-- Javascript에 의해 동적 입력 필드들이 생성됩니다. -->
          </div>

          <!-- 격자 크기 및 시작 인덱스 -->
          <div style="display: flex; gap: 10px;">
            <div class="control-group-vertical" style="flex: 1;">
              <label for="grid-cols">Width (Cols / X)</label>
              <input type="number" id="grid-cols" class="glass-input w-full" min="1" max="100" value="10" />
            </div>
            <div class="control-group-vertical" style="flex: 1;">
              <label for="grid-rows">Height (Rows / Y)</label>
              <input type="number" id="grid-rows" class="glass-input w-full" min="1" max="100" value="10" />
            </div>
          </div>

          <!-- X, Y 시작 좌표 설정 -->
          <div style="display: flex; gap: 10px;">
            <div class="control-group-vertical" style="flex: 1;">
              <label for="grid-start-x">X Start</label>
              <input type="number" id="grid-start-x" class="glass-input w-full" value="1" />
            </div>
            <div class="control-group-vertical" style="flex: 1;">
              <label for="grid-start-y">Y Start</label>
              <input type="number" id="grid-start-y" class="glass-input w-full" value="1" />
            </div>
          </div>

          <div style="display: flex; gap: 10px; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 6px;">
              <input type="checkbox" id="grid-y-invert" class="glass-checkbox" />
              <label for="grid-y-invert" class="checkbox-label">Invert Y (Bottom-Up)</label>
            </div>
          </div>

          <!-- 웨이퍼 노치/회전 설정 -->
          <hr style="border-color: var(--border-color); margin: 5px 0;">
          <h3 style="margin: 0; font-size: 0.95rem; color: var(--color-secondary);">Wafer Orientation</h3>
          
          <div class="control-group-vertical">
            <label>Map Rotation (회전)</label>
            <div style="display: flex; gap: 5px;">
              <button type="button" class="glass-btn btn-rot active" data-rot="0" style="flex: 1; padding: 4px; justify-content: center;">0°</button>
              <button type="button" class="glass-btn btn-rot" data-rot="90" style="flex: 1; padding: 4px; justify-content: center;">90°</button>
              <button type="button" class="glass-btn btn-rot" data-rot="180" style="flex: 1; padding: 4px; justify-content: center;">180°</button>
              <button type="button" class="glass-btn btn-rot" data-rot="270" style="flex: 1; padding: 4px; justify-content: center;">270°</button>
            </div>
          </div>

          <div class="control-group-vertical">
            <label>Wafer Side (앞/뒷면 반전)</label>
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.85rem;">
                <input type="radio" name="wafer-side" value="front" checked style="accent-color: var(--color-primary);" />
                Front (앞면 / 노치 우측 편향)
              </label>
              <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.85rem;">
                <input type="radio" name="wafer-side" value="back" style="accent-color: var(--color-primary);" />
                Back (뒷면 / 노치 좌측 편향)
              </label>
            </div>
          </div>

          <!-- 상세 컬럼 매핑 설정 -->
          <details class="glass-details">
            <summary>Advanced Column Mapping</summary>
            <div style="padding-top: 10px; display: flex; flex-direction: column; gap: 8px;">
              <div class="control-group-vertical">
                <label for="col-map-x">X Column</label>
                <select id="col-map-x" class="glass-input w-full"></select>
              </div>
              <div class="control-group-vertical">
                <label for="col-map-y">Y Column</label>
                <select id="col-map-y" class="glass-input w-full"></select>
              </div>
              <div class="control-group-vertical">
                <label for="col-map-val">Value Column</label>
                <select id="col-map-val" class="glass-input w-full"></select>
              </div>
            </div>
          </details>

          <button id="btn-load-map" class="glass-btn w-full" style="background: rgba(59,130,246,0.1); border-color: var(--color-primary); justify-content: center;">📂 Load Existing Map</button>

        </div>
      </aside>

      <!-- 우측 메인 영역: 2D 대화형 격자 편집 캔버스 -->
      <section class="grid-section" style="display: flex; flex-direction: column;">
        <div class="grid-toolbar" style="display: flex; gap: 10px; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid var(--border-color); background: rgba(10, 15, 26, 0.4);">
          <div style="display: flex; gap: 15px; align-items: center;">
            <span class="glass-log-badge">Active Brush: <strong id="active-brush-val" style="color: var(--color-primary);">None</strong></span>
            <span class="glass-log-badge" id="grid-status-coords">Cursor: -</span>
          </div>
          <div style="display: flex; gap: 10px;">
            <button id="btn-set-origin" class="glass-btn">📍 Set Origin (0,0)</button>
            <button id="btn-select-e1" class="glass-btn" style="color: #a78bfa; border-color: #a78bfa;">✔️ Select E1</button>
            <button id="btn-select-e2" class="glass-btn" style="color: #f472b6; border-color: #f472b6;">✔️ Select E2</button>
            <button id="btn-autopaint-e1e2" class="glass-btn" style="color: var(--color-success); border-color: var(--color-success);">⚡ Auto-Paint E1/E2</button>
            <button id="btn-fill-selected" class="glass-btn" style="display: none; background: rgba(59, 130, 246, 0.1); border-color: var(--color-primary);">🎨 Fill Selected</button>
            <button id="btn-clear-selected" class="glass-btn hover-danger" style="display: none;">🧹 Clear Selected</button>
            <button id="btn-clear-grid" class="glass-btn">🧹 Clear Grid</button>
            <button id="btn-fill-grid" class="glass-btn">🎨 Fill All</button>
            <button id="btn-push-map" class="glass-btn" style="background: rgba(16,185,129,0.2); border-color: var(--color-success); color: var(--color-success); font-weight: bold; padding: 6px 20px;">⚡ Push Map Data</button>
          </div>
        </div>

        <!-- 2D 캔버스 격자 조작 영역 (노치 표기용 래퍼 컨테이너 추가) -->
        <div id="map-workspace" style="flex: 1; display: flex; align-items: center; justify-content: center; overflow: auto; padding: 40px; background: rgba(0,0,0,0.2);">
          <div id="grid-wrapper" class="map-grid-wrapper">
            <!-- V-Notch가 동적으로 이 wrapper의 상/하/좌/우 중 하나로 렌더링됩니다. -->
            <div id="grid-notch" class="wafer-notch notch-bottom"></div>
            <div id="grid-canvas" class="map-grid-canvas"></div>
          </div>
        </div>
      </section>

      <!-- 우측 패널: 범례 관리 및 페인팅 브러쉬 -->
      <aside class="history-sidebar glass-panel" style="width: 400px; min-width: 400px;">
        <div class="sidebar-header">
          <h2>2. Value Legend & Brush</h2>
        </div>
        <div class="sidebar-content" style="display: flex; flex-direction: column; gap: 15px; padding: 15px; overflow-y: auto;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 0.85rem; color: var(--text-dim);">격자 채우기용 범례 정의 및 브러쉬</span>
            <button id="btn-add-legend" class="glass-page-btn" style="padding: 4px 12px; font-size: 0.8rem; font-weight: 500;">+ Add Legend</button>
          </div>
          <div class="table-container" style="flex: 1; min-height: 350px; overflow-y: auto;">
            <table class="sources-table" style="font-size: 0.9rem; width: 100%;">
              <thead>
                <tr>
                  <th style="width: 75px; text-align: left; padding: 8px;">Value</th>
                  <th style="text-align: left; padding: 8px;">Description</th>
                  <th style="width: 70px; text-align: center; padding: 8px;">Count</th>
                  <th style="width: 70px; text-align: center; padding: 8px;">Color</th>
                  <th style="width: 40px; text-align: center; padding: 8px;">Del</th>
                </tr>
              </thead>
              <tbody id="legend-list">
                <!-- 범례 아이템 및 브러쉬 선택 활성화 상태가 여기에 생성됨 -->
              </tbody>
            </table>
          </div>
        </div>
      </aside>
    </main>
  </div>
</body>
</html>
