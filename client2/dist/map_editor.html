            <path

          </svg>
        </button>
        <a href="/index.html" class="glass-btn hover-danger" style="text-decoration: none;">&larr; Back to Grid</a>
      </div>

    <main class="main-layout">
      <!-- 좌측 패널: 기능별 4단계 맵 설정 및 메타데이터 검색 -->
      <aside class="history-sidebar glass-panel" style="width: 330px; min-width: 330px;">
        <div class="sidebar-header">
          <h2>Map Configuration</h2>
        </div>
        <div class="sidebar-content"
          style="display: flex; flex-direction: column; gap: 15px; padding: 15px; overflow-y: auto;">

          <!-- 1. Map Search & Load -->
          <div
            style="display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;">
            <h3
              style="margin: 0; font-size: 0.95rem; color: var(--color-primary); display: flex; align-items: center; gap: 6px;">
              <span>🔍 1. Map Search & Load</span>
            </h3>
            <!-- 대상 테이블 선택 -->
            <div class="control-group-vertical">
              <label for="map-table-select">Target Table</label>
              <select id="map-table-select" class="glass-input w-full"></select>
            </div>
            <!-- 동적 메타데이터 입력 영역 -->
            <div id="metadata-fields-container" style="display: flex; flex-direction: column; gap: 10px;">
              <!-- Javascript에 의해 동적 입력 필드들이 생성됩니다. -->
            </div>
            <!-- 메타데이터 기반 기존 맵 불러오기 버튼 -->
            <button type="button" id="btn-load-map" class="glass-btn w-full"
              style="background: var(--accent-weak); border-color: var(--accent); color: var(--accent); font-weight: bold; justify-content: center; padding: 8px; margin-top: 4px;">📂
              Load Existing Map</button>
            <!-- The 0.7rem note ("[📂 Load]는 항상 교체 로드입니다 …") was deleted: it sat below the
                 0.8rem fact floor and restated what the two buttons already say by being two
                 buttons. The contract lives in docs/map_editor/README.md. -->
          </div>

          <!-- 오버레이(겹쳐 보기) — 메인 Load와 **완전히 분리된 전용 블록**.
               메인 Load = 항상 교체 / 여기 [＋ 겹치기] = 항상 겹치기.
               모드 토글도 확인 다이얼로그도 없다 — 어느 버튼을 눌렀는지가 곧 의도다.
               여러 테이블·여러 맵 키를 누적할 수 있다. -->
          <details class="overlay-box" id="overlay-box" open>
            <summary class="overlay-box-head">
              <span>🗂 오버레이 <b id="overlay-count" class="ov-count">0</b></span>
            </summary>
            <div class="ov-body">
              <div class="ov-add">
                <select id="overlay-src-table" class="glass-input" title="겹칠 맵의 테이블"></select>
                <input type="text" id="overlay-src-key" class="glass-input ov-key-input" list="overlay-src-key-list"
                  placeholder="맵 키 (예: LOT-A_05)" autocomplete="off" title="겹칠 맵의 키" />
                <button type="button" id="btn-add-overlay" class="glass-page-btn ov-add-btn">＋ 겹치기</button>
              </div>
              <!-- [키 자동완성] 유효 다이 지정 칸(#valid-die-ref-list)과 **같은 기계**다 —
                   새 컨트롤이 아니라 이미 있는 입력칸의 `list=` 하나. 목록은 소스 테이블에
                   규격이 등록된 맵 키뿐이며(등록 없는 키는 겹쳐도 반드시 실패한다),
                   목록에 없는 키를 직접 타이핑하는 경로는 오늘과 완전히 동일하다.
                   `.ov-add`는 grid라 datalist를 그 안에 두지 않는다 — 레이아웃 칸을 먹지
                   않게 그리드 밖에 둔다(datalist 자체는 display:none이다). -->
              <datalist id="overlay-src-key-list"></datalist>
              <!-- The `.ov-note` paragraph was deleted. It explained the alignment contract, which
                   is documentation (spec/MAP_EDITOR_SPEC §5); what an operator acts on is the
                   per-layer chip (정렬됨 / 무보정 / 화면기준) that the list below already renders. -->
              <div id="overlay-list"></div>
              <button type="button" id="btn-clear-overlays" class="glass-page-btn ov-clear">모두 해제</button>
            </div>
          </details>

          <!-- 2. Grid & Orientation Settings -->
          <div
            style="display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;">
            <h3
              style="margin: 0; font-size: 0.95rem; color: var(--color-secondary); display: flex; align-items: center; gap: 6px;">
              <span>🧩 2. Grid & Orientation Settings</span>
            </h3>
            <!-- 격자 크기 (Calculated) -->
            <div style="display: flex; gap: 10px;">
              <div class="control-group-vertical" style="flex: 1;">
                <label for="grid-cols">Width (Cols / X)</label>
                <input type="number" id="grid-cols" class="glass-input w-full" min="1" max="100" value="10" readonly
                  style="cursor: not-allowed; opacity: 0.6; background-color: var(--bg-inset);" />
              </div>
              <div class="control-group-vertical" style="flex: 1;">
                <label for="grid-rows">Height (Rows / Y)</label>
                <input type="number" id="grid-rows" class="glass-input w-full" min="1" max="100" value="10" readonly
                  style="cursor: not-allowed; opacity: 0.6; background-color: var(--bg-inset);" />
              </div>
            </div>
            <!-- X, Y 시작 좌표 설정 -->
            <div style="display: flex; gap: 10px;">
              <div class="control-group-vertical" style="flex: 1;">
                <label for="grid-start-x">X Start</label>
                <input type="number" id="grid-start-x" class="glass-input w-full" value="1" />
              </div>
              <div class="control-group-vertical" style="flex: 1;">
                <label for="grid-start-y">Y Start</label>
                <input type="number" id="grid-start-y" class="glass-input w-full" value="1" />
              </div>
            </div>
            <!-- 회전 설정 -->
            <div class="control-group-vertical">
              <label>Map Rotation (회전)</label>
              <div style="display: flex; gap: 5px;">
                <button type="button" class="glass-btn btn-rot active" data-rot="0"
                  style="flex: 1; padding: 4px; justify-content: center;">0°</button>
                <button type="button" class="glass-btn btn-rot" data-rot="90"
                  style="flex: 1; padding: 4px; justify-content: center;">90°</button>
                <button type="button" class="glass-btn btn-rot" data-rot="180"
                  style="flex: 1; padding: 4px; justify-content: center;">180°</button>
                <button type="button" class="glass-btn btn-rot" data-rot="270"
                  style="flex: 1; padding: 4px; justify-content: center;">270°</button>
              </div>
            </div>
            <!-- 관찰면 설정 -->
            <div class="control-group-vertical">
              <label>Wafer Side (앞/뒷면 반전)</label>
              <div style="display: flex; flex-direction: column; gap: 6px;">
                <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.85rem;">
                  <input type="radio" name="wafer-side" value="front" checked
                    style="accent-color: var(--color-primary);" />
                  Front (앞면 / 노치 우측 편향)
                </label>
                <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.85rem;">
                  <input type="radio" name="wafer-side" value="back" style="accent-color: var(--color-primary);" />
                  Back (뒷면 / 노치 좌측 편향)
                </label>
              </div>
            </div>
            <!-- 옵션 체크박스 -->
            <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px;">
              <div style="display: flex; align-items: center; gap: 6px;">
                <input type="checkbox" id="separate-from-background" class="glass-checkbox" />
                <label for="separate-from-background" class="checkbox-label"
                  title="켜면 회전·앞뒤·Invert Y·START 를 바꿔도 저장 좌표가 고정됩니다. 셀이 그 좌표가 가리키는 새 칸으로 다시 앉으므로, 배경만 움직여 맞출 수 있습니다. 끄면 종전대로 다이를 붙들고 번호를 다시 매깁니다.">분리
                  모드 (저장 좌표 고정)</label>
              </div>
              <div style="display: flex; align-items: center; gap: 6px;">
                <input type="checkbox" id="grid-y-invert" class="glass-checkbox" />
                <label for="grid-y-invert" class="checkbox-label">Invert Y (Bottom-Up)</label>
              </div>
              <div style="display: flex; align-items: center; gap: 6px;">
                <input type="checkbox" id="show-annotations" class="glass-checkbox" checked />
                <label for="show-annotations" class="checkbox-label" style="color: var(--color-primary);">Show Cell
                  Coordinates</label>
              </div>
            </div>
          </div>

          <!-- 3. Physical Wafer Geometry -->
          <div
            style="display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;">
            <h3
              style="margin: 0; font-size: 0.95rem; color: var(--color-primary); display: flex; align-items: center; gap: 6px;">
              <span>📏 3. Physical Wafer Geometry</span>
            </h3>
            <!-- Wafer Geometry Presets (Server maps.json) -->
            <div class="control-group-vertical"
              style="border: 1px dashed var(--accent-2); border-radius: 8px; padding: 10px; background: var(--accent-2-weak);">
              <label for="preset-select"
                style="color: var(--color-secondary); font-weight: bold; display: flex; align-items: center; justify-content: space-between;">
                <span>⚙️ Geometry Presets</span>
                <div style="display: flex; gap: 4px;">
                  <button type="button" id="btn-save-preset" class="glass-page-btn"
                    style="padding: 2px 8px; font-size: 0.75rem; border-color: var(--color-secondary); color: var(--color-secondary);"
                    title="Save current physical geometry to server maps.json">💾 Save</button>
                  <button type="button" id="btn-delete-preset" class="glass-page-btn hover-danger"
                    style="padding: 2px 6px; font-size: 0.75rem; display: none;"
                    title="Delete selected custom preset from server">🗑️</button>
                </div>
              </label>
              <select id="preset-select" class="glass-input w-full" style="margin-top: 4px;">
                <option value="">-- Select Preset --</option>
              </select>
            </div>

            <!-- [M4②] 유효 다이 맵 — 원 기하의 대체 근거. 새 패널도 모달도 아니고
                 원 기하가 사는 이 블록의 한 줄이다. 비워 두면 오늘과 완전히 동일(원 기하).
                 만들기는 위 프리셋 목록의 「🧩 유효 다이 맵 만들기」 항목이 한다. -->
            <div class="control-group-vertical"
              style="border: 1px dashed var(--accent); border-radius: 8px; padding: 10px; background: var(--accent-weak);">
              <!-- [1-b] 저장 테이블은 `valid_die_ref` 하나로 고정됐다(사용자 지시). APPLY·SAVE
                   두 버튼은 삭제됐다(사용자 지시 2026-08-04): 키 칸이 <select>가 된 뒤로
                   「고르는 것」 자체가 이미 의도적인 한 번의 행위라 APPLY가 더할 것이 없고,
                   SAVE가 쓰던 한 필드는 ⚡ Push와 📐 규격만 저장이 이미 함께 싣는다.
                   그래서 이 블록의 컨트롤은 키 칸 하나뿐이다(순 -2). -->
              <label for="valid-die-ref-key"
                style="color: var(--accent); font-weight: bold; display: block;">
                🎯 유효 다이 맵 (Valid Die)
              </label>
              <!-- [1-a] 컨트롤은 **한 번에 하나만** 보인다. 목록이 모집단 전체일 때는 위
                   「⚙️ Geometry Presets」와 똑같은 <select>이고, 목록을 믿을 수 없을 때
                   (truncated·unavailable) 또는 지금 지정된 키가 목록에 없을 때는 텍스트
                   입력칸이다. select는 목록에 없는 키를 **고를 수 없는** 컨트롤이라,
                   목록이 모집단이 아닌 순간에 select를 내밀면 닿을 수 있던 맵이 닿을 수
                   없게 된다. 어느 쪽이 보이는지가 곧 "이 목록이 전부인가"의 답이다.
                   값의 정본은 언제나 #valid-die-ref-key 하나다 — select는 고른 값을 그
                   칸에 적을 뿐이고, 저장·적용 경로는 그 칸만 읽는다(두 번째 값 경로 없음).
                   [1-b] **적용 시점이 두 컨트롤에서 다르다.** select는 고르는 순간이 곧
                   확정이라 change에서 적용하고, 입력칸은 타이핑 도중이 곧 확정일 수 없으므로
                   Enter에서만 적용한다 — change(=blur)로 적용하면 값을 확인하려고 자리를
                   옮긴 것만으로 기하 메타가 갈아끼워지던 그 동작이 되살아난다. -->
              <div style="display: flex; flex-direction: column; gap: 5px; margin-top: 4px;">
                <select id="valid-die-ref-select" class="glass-input w-full" style="display: none;"
                  title="유효 다이 근거 맵 (비우면 원 기하)">
                  <option value="">-- 원 기하 (지정 없음) --</option>
                </select>
                <input type="text" id="valid-die-ref-key" class="glass-input w-full" list="valid-die-ref-list"
                  placeholder="valid_die_ref 맵 키 (비우면 원 기하)" autocomplete="off"
                  title="유효 다이 근거 맵 키 — Enter로 적용 (비우면 원 기하)" />
                <datalist id="valid-die-ref-list"></datalist>
              </div>
              <!-- The 0.75rem explanatory paragraph was deleted (below the 0.8rem fact floor, and
                   seven sentences of contract). Which control is on screen already answers "is this
                   list the whole population"; the rest is docs/guide/VALID_DIE_MAP_GUIDE.md. -->
            </div>
            <div class="control-group-vertical">
              <label for="phys-wafer-dia">Wafer Diameter (mm)</label>
              <select id="phys-wafer-dia" class="glass-input w-full">
                <option value="300" selected>300 mm (12")</option>
                <option value="200">200 mm (8")</option>
                <option value="150">150 mm (6")</option>
                <option value="custom">Custom</option>
              </select>
            </div>
            <div style="display: flex; gap: 8px;">
              <div class="control-group-vertical" style="flex: 1;">
                <label for="phys-chip-x">Chip X (mm)</label>
                <input type="number" id="phys-chip-x" class="glass-input w-full" step="0.1" value="2.5" />
              </div>
              <div class="control-group-vertical" style="flex: 1;">
                <label for="phys-chip-y">Chip Y (mm)</label>
                <input type="number" id="phys-chip-y" class="glass-input w-full" step="0.1" value="2.5" />
              </div>
            </div>
            <div style="display: flex; gap: 8px;">
              <div class="control-group-vertical" style="flex: 1;">
                <label for="phys-offset-x">Offset X (mm)</label>
                <input type="number" id="phys-offset-x" class="glass-input w-full" step="0.1" value="0.0" />
              </div>
              <div class="control-group-vertical" style="flex: 1;">
                <label for="phys-offset-y">Offset Y (mm)</label>
                <input type="number" id="phys-offset-y" class="glass-input w-full" step="0.1" value="0.0" />
              </div>
            </div>
            <div class="control-group-vertical">
              <label for="phys-edge-margin">Edge Exclusion (mm)</label>
              <input type="number" id="phys-edge-margin" class="glass-input w-full" step="0.1" value="3.0" />
            </div>
            <button type="button" id="btn-apply-phys-geom" class="glass-btn"
              style="background: var(--accent-weak); border-color: var(--accent); color: var(--accent); padding: 6px; font-weight: bold; width: 100%; justify-content: center; margin-top: 2px;">⚡
              Apply Physical Geometry</button>
          </div>



          <!-- 4. Advanced Column Mapping -->
          <details class="glass-details">
            <summary>⚙️ 4. Advanced Column Mapping</summary>
            <div style="padding-top: 10px; display: flex; flex-direction: column; gap: 8px;">
              <div class="control-group-vertical">
                <label for="col-map-x">X Column</label>
                <select id="col-map-x" class="glass-input w-full"></select>
              </div>
              <div class="control-group-vertical">
                <label for="col-map-y">Y Column</label>
                <select id="col-map-y" class="glass-input w-full"></select>
              </div>
              <div class="control-group-vertical">
                <label for="col-map-val">Value Column</label>
                <select id="col-map-val" class="glass-input w-full"></select>
              </div>
            </div>
          </details>

        </div>
      </aside>

      <!-- 우측 메인 영역: 2D 대화형 격자 편집 캔버스 -->
      <section class="grid-section" style="display: flex; flex-direction: column;">
        <!-- [편집 스택] 자재 맵을 연 동안에만 등장하는 브레드크럼 한 줄 + 뒤로가기 버튼 하나 -->
        <div id="map-breadcrumb" class="map-breadcrumb" style="display: none;"></div>
        <div class="grid-toolbar map-editor-toolbar">
          <div class="map-editor-toolbar__status">
            <!-- 관찰면(FRONT/BACK) 표기: 그리드 바깥(툴바)에 색상 구분 칩으로 표시 -->
            <div id="side-indicator" class="side-indicator side-front">FRONT · 앞면</div>
            <span class="glass-log-badge">Active Brush: <strong id="active-brush-val"
                style="color: var(--color-primary);">None</strong></span>
            <span class="glass-log-badge" id="grid-status-coords">Cursor: -</span>
            <!-- [M2] 페인트 잠금 상태 — 특히 "조회 실패로 직전 값 사용 중"을 화면에 남긴다 -->
            <span id="paint-lock-indicator" class="plock-chip" style="display: none;"></span>
            <!-- [C1] 칩 피치가 선언되지 않으면 셀 종횡비를 알 수 없다. 그때만 나타나는 수동
                 표기다(컨트롤이 아니다 — 누를 것도 고를 것도 없다). 피치를 지어내면 화면은
                 완벽히 정렬되는데 값이 전부 틀리므로, 지어내는 대신 모른다고 말한다. -->
            <span id="cell-aspect-note" class="glass-log-badge" style="display: none;"></span>

            <!-- Contextual Selection Actions -->
            <div id="selection-actions-container"
              style="display: none; align-items: center; gap: 8px; border-left: 1px solid var(--border-color); padding-left: 15px;">
              <button id="btn-fill-selected" class="glass-btn success-glow"
                style="padding: 4px 12px; font-size: 0.8rem;">🎨 Fill Selected</button>
              <button id="btn-clear-selected" class="glass-btn hover-danger"
                style="padding: 4px 12px; font-size: 0.8rem;">🧹 Clear Selected</button>
            </div>
          </div>
          <div class="map-editor-toolbar__actions">
            <!-- Selection & Edge Tools Dropdown -->
            <div class="control-group relative-menu">
              <button id="btn-select-menu" class="glass-btn">🔍 Select Tools</button>
              <div id="select-menu-dropdown" class="glass-dropdown-panel"
                style="display: none; right: 0; min-width: 180px;">
                <button id="btn-set-origin" class="dropdown-item">📍 Set Origin (0,0)</button>
                <button id="btn-select-e1" class="dropdown-item" style="color: var(--accent-2);">✔️ Select E1</button>
                <button id="btn-select-e2" class="dropdown-item" style="color: var(--danger);">✔️ Select E2</button>
                <button id="btn-autopaint-e1e2" class="dropdown-item"
                  style="color: var(--color-success); border-top: 1px solid var(--border-color); margin-top: 4px; padding-top: 8px;">⚡
                  Auto-Paint E1/E2</button>
              </div>
            </div>

            <!-- Operations Dropdown -->
            <div class="control-group relative-menu">
              <button id="btn-ops-menu" class="glass-btn">🛠️ Edit Grid</button>
              <div id="ops-menu-dropdown" class="glass-dropdown-panel"
                style="display: none; right: 0; min-width: 150px;">
                <button id="btn-fill-grid" class="dropdown-item">🎨 Fill All</button>
                <button id="btn-clear-grid" class="dropdown-item hover-danger" style="color: var(--color-danger);">🧹
                  Clear Grid</button>
                <button id="btn-copy-excel" class="dropdown-item"
                  style="border-top: 1px solid var(--border-color); margin-top: 4px; padding-top: 8px; color: var(--color-primary);">📋
                  Copy to Excel</button>
                <!-- COPY HEADER MODE — 새 패널이 아니라 이 메뉴의 한 줄. 켜면 [📋 Copy to Excel]이
                     상단 헤더(TITLE + Base/1H/MID/TOP)와 우측 보조표(VALUE·COUNT·STACK·DESC)를
                     격자와 함께 싣는다. 끄면 출력이 종전과 완전히 동일하다. -->
                <div class="dropdown-item checkbox-item">
                  <input type="checkbox" id="map-copy-header-toggle" class="glass-checkbox" />
                  <label for="map-copy-header-toggle" class="checkbox-label"
                    style="text-transform: none; letter-spacing: normal;"
                    title="상단 헤더와 우측 보조표를 함께 복사 (COUNT는 저장되는 셀만)">헤더
                    포함 (회사 양식)</label>
                </div>
              </div>
            </div>

            <!-- Primary Save Action -->
            <button id="btn-push-map" class="glass-btn"
              style="background: var(--success-weak); border-color: var(--success); color: var(--success); font-weight: bold; padding: 6px 20px;">⚡
              Push Map Data</button>
            <!-- [2] 규격만 저장 (사용자 지시 2026-08-04: "맵 에디터에 메타만 저장하는 기능 필요").
                 새 패널도 모달도 아니고 ⚡ Push 바로 옆의 버튼 하나다. 새 라우트도 없다 —
                 지워진 💾 SAVE가 쓰던 바로 그 PUT(`wafer_map_metadata`)을 한 필드가 아니라
                 규격 블록 전체로 넓혔을 뿐이고, 규격 객체는 Push와 **같은 조립기**
                 (`buildPushGridMetadata`)가 만든다. 대상은 지금 화면에 설정된 테이블·맵 키다. -->
            <button id="btn-save-map-spec" class="glass-btn"
              style="border-color: var(--color-secondary); color: var(--color-secondary); padding: 6px 14px;"
              title="규격만 기록 — 셀은 하나도 쓰지 않습니다">📐 규격만 저장</button>
          </div>
        </div>

        <!-- 2D 캔버스 격자 조작 영역 (노치 표기용 래퍼 컨테이너 추가) -->
        <div id="map-workspace"
          style="flex: 1; display: flex; align-items: center; justify-content: center; overflow: auto; padding: 40px; background: var(--bg-app);">
          <div id="grid-wrapper" class="map-grid-wrapper">
            <!-- V-Notch가 동적으로 이 wrapper의 상/하/좌/우 중 하나로 렌더링되며 D로 표기됩니다. -->
            <div id="grid-notch" class="wafer-notch notch-bottom">D</div>
            <div id="grid-canvas" class="map-grid-canvas">
              <canvas id="wafer-grid-canvas" style="width: 100%; height: 100%; display: block;"></canvas>
            </div>
          </div>
        </div>
      </section>

      <!-- [ⓗ] 폭 조절 손잡이. 이 프로젝트의 스플리터를 **그대로** 쓴다: `.split-resizer`
           클래스(style.css — 8px, cursor:col-resize, hover/dragging 강조)와 드래그 중
           `body.resizing-active`(선택 방지 + 사이드바 pointer-events 차단)가 이미 있고,
           그리드 화면의 `#main-split-resizer`가 같은 두 개를 쓴다. 새 스플리터를 만들지
           않는다. 자리는 패널의 **왼쪽 모서리** — 사람이 실제로 손을 뻗는 곳이다
           (종전 네이티브 `resize: horizontal` 그립은 우하단 모서리에 있었고, 끌어도
           폭이 기억되지 않았다). -->
      <div id="plan-split-resizer" class="split-resizer"
        title="폭 조절 (더블클릭 = 기본 폭)"></div>

      <!-- 우측 패널: legend = DOE 편집기 + DOE별 사용 자재 (이동 허브)
           legend 행 하나가 곧 DOE다 — 별도 「전사 계획」 영역도, 별도 「원시 범례」 details도 없다. -->
      <!-- 폭은 transfer_plan.css의 --plan-sidebar-w가 정본이다 (토스트 회피 오프셋이 같은 값을 쓴다) -->
      <aside class="history-sidebar glass-panel" id="plan-sidebar">
        <div class="sidebar-header"
          style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
          <h2>🎨 2. Legend &amp; DOE</h2>
          <button id="btn-add-legend" class="glass-page-btn"
            style="padding: 4px 12px; font-size: 0.78rem; font-weight: 500;">+ DOE</button>
        </div>
        <!-- 이중 스크롤: 위 DOE LIST는 자체 스크롤, 아래 자재 목록은 항상 화면에 남는다(이동 허브) -->
        <div class="sidebar-content" id="plan-sidebar-content"
          style="display: flex; flex-direction: column; gap: 0; padding: 0; overflow: hidden;">
          <div id="transfer-plan-root" style="display: flex; flex-direction: column; flex: 1; min-height: 0;"></div>
        </div>
      </aside>
    </main>
  </div>

  <!-- Modal for Coordinate System Import Choice -->
  <div id="choice-modal" class="glass-modal-overlay" style="display: none;">
    <div class="glass-modal-panel">
      <div class="glass-modal-header">
        <h3>좌표계 미확정</h3>
      </div>
      <div class="glass-modal-body">
        <p>어떤 좌표계로 읽을지 고르십시오.</p>
      </div>
      <div class="glass-modal-footer">
        <button id="btn-choice-standard" class="glass-btn success-glow">📐 Standard (Front, Start 0,0, Rot 0°)</button>
        <button id="btn-choice-current" class="glass-btn">⚙️ Use Current Left Panel Settings</button>
        <button id="btn-choice-cancel" class="glass-btn hover-danger">❌ Cancel Loading</button>
      </div>
    </div>
  </div>


</body>

</html>
