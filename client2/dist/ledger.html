<!doctype html>
<html lang="ko" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- FOUC 방지: CSS 로드 전에 저장된 테마를 <html data-theme>에 스탬프 (theme.js와 동일 키) -->
  <script>(function(){try{var t=localStorage.getItem('theme');document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
  <title>AssyManager - 원장 혈통 추적</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧬</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    /* ── 디자인 토큰은 tokens.css(SSOT, ledger_trace.js가 임포트)에서 공급 ──
       이 블록은 이 페이지의 레이아웃/컴포넌트만 정의하며 시맨틱 토큰만 참조한다.

       🔴 가독성 = 기능. 이 화면의 내용은 「왜 이 답인가」라는 서버의 문장이고,
          그 문장이 작으면 화면이 존재할 이유가 없어진다. 본문 15px, 서버 문장
          14px 모노, 메타 13px — 그 아래로 내리지 말 것. */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background: var(--bg-app);
      color: var(--text);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────────── */
    .lt-app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
    }

    .lt-app-header__inner {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .lt-title {
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .lt-title__sub {
      font-size: 14px;
      font-weight: 400;
      color: var(--text-dim);
    }

    .lt-ask {
      flex: 1 1 340px;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 280px;
    }

    /* 이 화면의 유일한 입력. 랏 하나, 「랏/슬롯」이면 그 자리까지. */
    #lt-query {
      flex: 1 1 auto;
      min-width: 0;
      font-family: var(--font-mono);
      font-size: 15px;
      padding: 10px 14px;
      color: var(--text);
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    #lt-query::placeholder { color: var(--text-dim); font-family: var(--font-sans); }

    #lt-query:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--focus-ring);
    }

    .lt-ask__hint {
      font-size: 13px;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .lt-home {
      font-size: 14px;
      color: var(--text-muted);
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      white-space: nowrap;
      transition: background .15s ease, color .15s ease;
    }
    .lt-home:hover { background: var(--surface-hover); color: var(--text); }

    /* ── Page ───────────────────────────────────────────────── */
    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 24px 24px 72px;
    }

    /* ── 답의 머리: 무엇을 물었고, 사슬이 어떤 구성인가 ──────── */
    .lt-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .lt-head__subject {
      font-family: var(--font-mono);
      font-size: 19px;
      font-weight: 500;
      letter-spacing: -0.01em;
      word-break: break-all;
    }

    .lt-chips { display: flex; gap: 8px; flex-wrap: wrap; }

    .lt-chip {
      font-size: 14px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .lt-chip--lots { background: var(--bg-inset); color: var(--text-muted); border-color: var(--border); }
    .lt-chip--ok { background: var(--success-weak); color: var(--success); border-color: var(--success); }
    .lt-chip--contested { background: var(--warning-weak); color: var(--warning); border-color: var(--warning); }
    .lt-chip--gap { background: var(--info-weak); color: var(--info); border-color: var(--info); }
    /* 가정은 실선이 아니라 점선 — 아래 홉 레일과 같은 신호를 머리에서 미리 준다. */
    .lt-chip--convention {
      background: var(--overwrite-weak);
      color: var(--overwrite);
      border: 1px dashed var(--overwrite);
    }

    /* ── 사슬 ───────────────────────────────────────────────── */
    .lt-chain { list-style: none; display: flex; flex-direction: column; gap: 10px; }

    .lt-hop {
      display: flex;
      gap: 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px 14px 0;
      box-shadow: var(--shadow-card);
      animation: lt-rise .22s ease both;
    }

    @keyframes lt-rise {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .lt-hop { animation: none; }
    }

    /* 🔴 두 신호는 직교한다 — 색은 상태(확정/이견/미확정), 무늬는 근거(실선=출처가
       말한 것, 점선=선언된 가정). 가정에 기댄 홉과 관측에 기댄 홉이 한눈에 달라야
       한다는 것이 이 화면의 존재 이유(온톨로지 소유자 2026-08-13 판정: 규약 유래
       원자는 class 3 inference). */
    .lt-hop__rail {
      flex: 0 0 6px;
      border-radius: 12px 0 0 12px;
      background: var(--border-strong);
    }
    .lt-hop--ok .lt-hop__rail { background: var(--success); }
    .lt-hop--contested .lt-hop__rail { background: var(--warning); }
    .lt-hop--gap .lt-hop__rail { background: var(--info); }
    .lt-hop--end .lt-hop__rail { background: var(--accent); }

    .lt-hop--convention .lt-hop__rail {
      background: repeating-linear-gradient(
        to bottom,
        var(--overwrite) 0 9px,
        transparent 9px 16px);
    }
    .lt-hop--convention { border-color: var(--overwrite); border-style: dashed; }

    .lt-hop__body { flex: 1 1 auto; min-width: 0; }

    .lt-hop__top {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--text-muted);
      font-size: 14px;
    }

    .lt-hop__ordinal {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-dim);
      min-width: 20px;
    }

    .lt-hop__from {
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--text-muted);
      word-break: break-all;
    }

    .lt-hop__q { font-size: 15px; color: var(--text); font-weight: 500; }

    .lt-hop__answer {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 8px 0 6px;
    }

    .lt-badge {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.01em;
      padding: 4px 10px;
      border-radius: 7px;
      white-space: nowrap;
      background: var(--bg-inset);
      color: var(--text-muted);
    }
    .lt-badge--ok { background: var(--success-weak); color: var(--success); }
    .lt-badge--contested { background: var(--warning-weak); color: var(--warning); }
    /* 미확정은 오류색이 아니다 — 아무도 기록하지 않았다는 사실이 곧 내용이다. */
    .lt-badge--gap { background: var(--info-weak); color: var(--info); }
    .lt-badge--end { background: var(--accent-weak); color: var(--accent); }
    .lt-badge--truncated { background: var(--orange-weak); color: var(--orange); }

    .lt-hop__value {
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -0.01em;
      word-break: break-all;
    }
    .lt-hop__value--none { color: var(--text-dim); font-weight: 400; }

    .lt-hop__context {
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--text-dim);
      word-break: break-all;
    }

    .lt-basis {
      font-size: 13px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 999px;
      white-space: nowrap;
      background: var(--bg-inset);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    /* 「가정」과 「근거」는 같은 자리에 오지만 절대 같아 보이면 안 된다. */
    .lt-basis--convention {
      background: var(--overwrite-weak);
      color: var(--overwrite);
      border: 1px dashed var(--overwrite);
    }

    /* 서버가 쓴 문장 그대로. 이 화면에서 제일 중요한 줄이므로 작게 쓰지 않는다. */
    .lt-hop__reason {
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.65;
      color: var(--text-muted);
      background: var(--bg-inset);
      border-radius: 8px;
      padding: 8px 12px;
      word-break: break-word;
    }

    .lt-hop__meta {
      margin-top: 7px;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-dim);
      word-break: break-all;
    }

    /* ── 사슬의 끝 ──────────────────────────────────────────── */
    .lt-terminal {
      margin-top: 14px;
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-left: 6px solid var(--border-strong);
    }
    .lt-terminal--end { border-left-color: var(--accent); }
    .lt-terminal--gap { border-left-color: var(--info); }
    .lt-terminal--contested { border-left-color: var(--warning); }
    .lt-terminal--truncated { border-left-color: var(--orange); }

    .lt-terminal__reason {
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--text-muted);
      word-break: break-word;
    }

    .lt-generated {
      margin-top: 12px;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-dim);
      text-align: right;
    }

    /* ── 답이 아닌 상태(질문 전 · 조회 중 · 서버 거절) ───────── */
    .lt-notice {
      padding: 28px 24px;
      border-radius: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
    }
    .lt-notice--error { border-left: 6px solid var(--danger); }
    .lt-notice--busy { border-left: 6px solid var(--accent); }
    .lt-notice--idle { border-left: 6px solid var(--border-strong); }

    .lt-notice__title { font-size: 17px; font-weight: 600; }

    .lt-notice__detail {
      margin-top: 8px;
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--text-muted);
      word-break: break-word;
      /* 진단 한 줄 + 서버가 쓴 문장 한 줄. 둘은 다른 사람이 쓴 문장이므로 붙이지 않는다. */
      white-space: pre-line;
    }

    /* ── 어떤 「없음」인가 ────────────────────────────────────
       🔴 이 화면이 이번 라운드에 존재하는 이유. 원장 미설치 · 백필 미실행 ·
          없는 랏 · 혈통 주장 없음 — 넷이 같은 빈 화면으로 보였다. 답 위에
          놓는 것은 아래 사슬의 「의미」를 바꾸기 때문이다. */
    .lt-nothing {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-left: 6px solid var(--info);
    }
    .lt-nothing--error { border-left-color: var(--danger); }
    .lt-nothing--gap { border-left-color: var(--info); }

    /* 🔴 홉 뱃지는 13px(메타)지만 이 자리의 뱃지는 메타가 아니라 이 화면 상태의
       제목이다. 「등재됐으나 혈통 주장 없음」이 아래 서버 문장보다 작으면 읽히는
       순서가 뒤집힌다 — 가독성 = 기능. */
    .lt-nothing .lt-badge {
      font-size: 15px;
      padding: 5px 12px;
    }

    .lt-nothing__detail {
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--text-muted);
      word-break: break-word;
    }

    /* ── 질문 전: 무엇을 물을 수 있나 ─────────────────────────
       새 영역이 아니라 원래 있던 빈 상태의 「내용」이다. 표본은 링크 —
       이 화면의 답은 원래 URL이므로 조작 장치가 필요 없다. */
    .lt-coverage {
      padding: 28px 24px;
      border-radius: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-left: 6px solid var(--border-strong);
      box-shadow: var(--shadow-card);
    }
    .lt-coverage--ok { border-left-color: var(--accent); }
    .lt-coverage--gap { border-left-color: var(--info); }
    .lt-coverage--error { border-left-color: var(--danger); }

    .lt-coverage__title { font-size: 17px; font-weight: 600; }

    .lt-coverage__detail {
      margin-top: 8px;
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--text-muted);
      word-break: break-word;
    }

    .lt-facts {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px 28px;
    }

    .lt-fact { display: flex; align-items: baseline; gap: 10px; }

    .lt-fact__term {
      font-size: 14px;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .lt-fact__value {
      font-family: var(--font-mono);
      font-size: 15px;
      color: var(--text);
      word-break: break-all;
    }

    .lt-samples {
      list-style: none;
      margin-top: 16px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* 표본 하나가 곧 하나의 질문이다. 작게 쓰지 않는다 — 이걸 누르는 게 이
       화면의 첫 동작이다. */
    .lt-samples__link {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 15px;
      padding: 7px 14px;
      border-radius: 999px;
      text-decoration: none;
      color: var(--accent);
      background: var(--accent-weak);
      border: 1px solid transparent;
      transition: border-color .15s ease, transform .15s ease;
    }
    .lt-samples__link:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .lt-samples__link:focus-visible {
      outline: none;
      box-shadow: 0 0 0 4px var(--focus-ring);
    }

    @media (prefers-reduced-motion: reduce) {
      .lt-samples__link:hover { transform: none; }
    }

    .lt-coverage__hint {
      margin-top: 16px;
      font-size: 14px;
      color: var(--text-dim);
    }

    /* ── 막다른 답의 다음 한 걸음 ─────────────────────────────
       🔴 없는 랏을 물었을 때 「원장에 없음」은 맞는 문장이었지만 화면은 막다른
          길이었다. 위 표본 목록을 그대로 재사용한다 — 같은 링크, 같은 질문.

       답을 「다시 말하는」 줄이 아니라 답을 읽은 다음의 한 걸음이므로 사슬 위가
       아니라 종단 블록 아래에 온다. 답보다 낮은 위계라 왼쪽 굵은 테두리를 쓰지
       않고 인셋 배경으로 물러난다 — 점선은 이 화면에서 「가정」의 뜻이라 여기에
       쓰지 않는다. 제목은 15px, 메타로 내리지 않는다(가독성 = 기능). */
    .lt-forward {
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--bg-inset);
      border: 1px solid var(--border);
    }

    .lt-forward__title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .lt-forward .lt-samples { margin-top: 12px; }

    /* ══ 케이스-컨트롤 조사 콘솔 ═══════════════════════════════
       🔴 새 페이지가 아니라 이 화면의 성장이다. 위 혈통 추적과 같은 토큰·같은
          위계·같은 「없음은 내용이다」 규율을 쓴다.

       🔴 폼 컨트롤이 하나도 없다. 종류 고르기·슬라이스 걸기·해제가 전부
          앵커다 — 이 화면의 답은 원래 URL이므로. 그래서 페이지의 입력은
          여전히 위쪽 랏 상자 하나뿐이다.

       🔴 가독성 = 기능. 율은 28px, 분수는 15px 모노, 분모 설명 14px.
          분수를 메타 크기로 내리면 「분모와 함께」가 형식만 남는다. */
    .cc { display: flex; flex-direction: column; gap: 14px; margin-bottom: 26px; }

    /* ── 종류 선택기 — 어휘에서 생성, 하드코딩 없음 ─────────── */
    .cc-kinds {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
    }

    .cc-kinds__term {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .cc-kinds__list { display: flex; gap: 8px; flex-wrap: wrap; }

    .cc-kind {
      display: inline-flex;
      align-items: baseline;
      gap: 7px;
      font-size: 15px;
      padding: 7px 14px;
      border-radius: 999px;
      text-decoration: none;
      color: var(--text-muted);
      background: var(--bg-inset);
      border: 1px solid var(--border);
      transition: border-color .15s ease, transform .15s ease, color .15s ease;
    }
    .cc-kind:hover { border-color: var(--accent); color: var(--text); transform: translateY(-1px); }
    .cc-kind:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--focus-ring); }

    .cc-kind--active {
      background: var(--accent-weak);
      color: var(--accent);
      border-color: var(--accent);
      font-weight: 600;
    }

    /* 커버리지 — 어느 종류에 데이터가 있는지가 선택의 근거다. */
    .cc-kind__n { font-family: var(--font-mono); font-size: 13px; color: var(--text-dim); }
    .cc-kind--active .cc-kind__n { color: var(--accent); }

    .cc-kind__nodenom {
      font-size: 12px;
      padding: 1px 6px;
      border-radius: 5px;
      background: var(--info-weak);
      color: var(--info);
      white-space: nowrap;
    }

    .cc-kinds__none { font-size: 14px; color: var(--text-dim); }

    .cc-standing {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px 16px;
      border-radius: 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-left: 6px solid var(--info);
    }
    .cc-standing__kind { font-family: var(--font-mono); font-size: 15px; }
    .cc-standing__why { font-size: 14px; color: var(--text-muted); }

    /* ── 패널 ─────────────────────────────────────────────────── */
    .cc-panel {
      padding: 16px 18px;
      border-radius: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
    }

    .cc-panel__title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-dim);
      letter-spacing: 0.02em;
      margin-bottom: 12px;
    }

    .cc-empty { font-size: 14px; color: var(--text-dim); }

    /* ── 율 — 분수는 절대 숨기지 않는다 ───────────────────────── */
    .cc-rate { display: inline-flex; align-items: baseline; gap: 8px; white-space: nowrap; }

    .cc-rate__pct {
      font-family: var(--font-mono);
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .cc-rate--lead .cc-rate__pct { font-size: 32px; }

    /* 🔴 분수는 메타가 아니다 — 율의 나머지 절반이다. */
    .cc-rate__frac { font-family: var(--font-mono); font-size: 15px; color: var(--text-muted); }
    .cc-rate--lead .cc-rate__frac { font-size: 18px; }

    .cc-rate__why {
      font-size: 13px;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--info-weak);
      color: var(--info);
    }
    .cc-rate--lead .cc-rate__why { font-size: 15px; padding: 5px 12px; }

    /* ── 현황 머리 ────────────────────────────────────────────── */
    .cc-headline {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .cc-den {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      text-align: right;
    }
    .cc-den__title { font-family: var(--font-mono); font-size: 15px; color: var(--text); }
    .cc-den__detail { font-size: 14px; color: var(--text-dim); }

    /* 분모 없음은 오류색이 아니다 — 종류에 대한 사실이다. */
    .cc-den--undeclared .cc-den__title,
    .cc-den--unreported .cc-den__title { color: var(--info); font-weight: 600; }

    /* ── 슬라이스 ─────────────────────────────────────────────── */
    .cc-slicechips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

    .cc-slicechip {
      font-size: 14px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 999px;
      text-decoration: none;
      background: var(--accent-weak);
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    .cc-slicechip:hover { background: var(--surface-active); }

    /* 이 패널의 두 숫자는 «같은 종류가 아니다» — 위는 발생률, 아래는 난 쪽 비중.
       분모가 다르므로 한 줄로 말해 준다. 메타로 내리지 않는다(가독성 = 기능). */
    .cc-slices__caption {
      margin-top: 14px;
      font-size: 14px;
      color: var(--text-muted);
      background: var(--bg-inset);
      border-radius: 8px;
      padding: 7px 12px;
    }

    .cc-slice { margin-top: 14px; }

    .cc-slice__term {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .cc-slice__term { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .cc-slice__name { font-size: 14px; font-weight: 600; color: var(--text-dim); }

    /* 축의 «귀속 가능 건수»는 아래 행들의 분모가 아니다 — 다를 때만 뜬다. */
    .cc-slice__cov {
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 1px 8px;
      border-radius: 5px;
      background: var(--info-weak);
      color: var(--info);
    }

    /* 세 수가 «안 맞는» 이유. 없으면 독자가 더해 보고 차이만 발견한다. */
    .cc-pop__outside {
      margin-top: 6px;
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--text-muted);
      background: var(--bg-inset);
      border-radius: 8px;
      padding: 8px 12px;
    }

    .cc-slice__rows { display: flex; flex-direction: column; gap: 4px; }

    .cc-slicerow {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 7px 12px;
      border-radius: 8px;
      text-decoration: none;
      color: var(--text);
      background: var(--bg-inset);
      border: 1px solid transparent;
      transition: border-color .15s ease;
    }
    .cc-slicerow:hover { border-color: var(--accent); }
    .cc-slicerow:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--focus-ring); }

    .cc-slicerow__key { font-family: var(--font-mono); font-size: 15px; }

    /* 어휘가 선언했는데 이 조회에 안 나온 클래스 — 「0건」이 아니라 「미보고」다.
       배경 없이 물러나되 여전히 눌러서 물을 수 있는 링크로 남는다. */
    .cc-slicerow--declared { background: transparent; border-style: dashed; border-color: var(--border); }
    .cc-slicerow--declared .cc-slicerow__key { color: var(--text-dim); }

    /* class 축은 첫 줄에 온다 — 「계면 보이드만 이 장비에 몰림」이 이 화면의 발견이라
       그 축이 아래로 밀리면 대조가 안 보인다. 판정이 아니라 분류이므로 색은 중립. */
    .cc-slice[data-axis="class"] .cc-slice__term { color: var(--accent); }

    /* ── 3분할 모집단 ─────────────────────────────────────────── */
    .cc-pop {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .cc-pop__cell {
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--bg-inset);
      border: 1px solid var(--border);
      border-top: 4px solid var(--border-strong);
    }
    .cc-pop__cell--found { border-top-color: var(--warning); }
    .cc-pop__cell--clean { border-top-color: var(--success); }

    /* 🔴 미스캔은 제3 부류다 — 점선이 「분모 밖」이라는 뜻을 색보다 먼저 준다. */
    .cc-pop__cell--out { border-style: dashed; border-top-color: var(--info); }

    .cc-pop__term { font-size: 14px; color: var(--text-dim); }

    .cc-pop__n {
      font-family: var(--font-mono);
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    .cc-pop__note { font-size: 13px; color: var(--text-dim); }

    .cc-pop__sum {
      margin-top: 12px;
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--text-muted);
      background: var(--bg-inset);
      border-radius: 8px;
      padding: 8px 12px;
    }

    /* ── 공통점 / 차이점 ──────────────────────────────────────── */
    .cc-rows { list-style: none; display: flex; flex-direction: column; gap: 6px; }

    .cc-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 9px 12px;
      border-radius: 8px;
      background: var(--bg-inset);
    }

    .cc-row__factor { display: flex; align-items: baseline; gap: 8px; }
    .cc-row__term { font-size: 13px; color: var(--text-dim); }
    .cc-row__key { font-family: var(--font-mono); font-size: 16px; font-weight: 500; }

    .cc-row__sides { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }

    .cc-side { display: inline-flex; align-items: baseline; gap: 7px; }
    .cc-side__term { font-size: 13px; color: var(--text-dim); white-space: nowrap; }
    .cc-side[data-side="clean"] .cc-rate__pct,
    .cc-side[data-side="base"] .cc-rate__pct { color: var(--text-muted); font-weight: 500; }

    .cc-lift {
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 7px;
      background: var(--warning-weak);
      color: var(--warning);
      white-space: nowrap;
    }

    /* 🔴 「분모 없음 — 대조 불가」는 오류 화면이 아니라 이 패널의 내용이다.
          위 lt-nothing과 같은 규율 — 사유가 함께 있어야 읽을 수 있다. */
    .cc-nodenom {
      padding: 14px 16px;
      border-radius: 10px;
      background: var(--info-weak);
      border-left: 6px solid var(--info);
    }
    .cc-nodenom__title { font-size: 16px; font-weight: 600; color: var(--info); }
    .cc-nodenom__why { margin-top: 6px; font-size: 14px; color: var(--text-muted); }

    /* 요인이 «공정»인지 «검사»인지 — 배지이지 필터가 아니다. 이 둘을 구분 못 하면
       스캐너 아티팩트를 공정 원인으로 보고하게 된다. */
    .cc-about {
      font-size: 12px;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: 5px;
      background: var(--bg-surface);
      color: var(--text-dim);
      border: 1px solid var(--border);
    }
    .cc-about--inspection { background: var(--info-weak); color: var(--info); border-color: transparent; }
    .cc-about--process { background: var(--accent-weak); color: var(--accent); border-color: transparent; }

    .cc-lift { display: inline-flex; align-items: baseline; gap: 6px; }
    .cc-lift--up { background: var(--warning-weak); color: var(--warning); }
    .cc-lift--down { background: var(--info-weak); color: var(--info); }
    .cc-lift--flat { background: var(--bg-surface); color: var(--text-dim); }
    .cc-lift--gap { background: var(--info-weak); color: var(--info); }
    /* 구간은 «점추정보다 먼저» 읽혀야 하는 것이 아니라 함께 읽혀야 하는 것 —
       작지만 메타보다 크게. */
    .cc-lift__ci { font-family: var(--font-mono); font-size: 13px; font-weight: 400; opacity: .85; }

    .cc-row__why { font-family: var(--font-mono); font-size: 13px; color: var(--info); }

    /* ── 이송 추적 — 길이 가변 홉 리스트 ──────────────────────── */
    .cc-trace__subject {
      font-family: var(--font-mono);
      font-size: 17px;
      font-weight: 500;
      margin-bottom: 10px;
    }

    .cc-hops { list-style: none; display: flex; flex-direction: column; gap: 8px; }

    .cc-hop {
      padding: 10px 14px;
      border-radius: 10px;
      background: var(--bg-inset);
      border: 1px solid var(--border);
      border-left: 5px solid var(--success);
    }
    .cc-hop--unresolvable { border-left-color: var(--info); }

    /* 🔴 끊김은 잇지 않고 «보인다». 만나지 않는 두 홉을 나란히 그리면
       기록되지 않은 연결을 화면이 주장하는 것이다. */
    .cc-hop--break { border-left-color: var(--danger); border-style: dashed; }

    .cc-hop__break {
      font-size: 14px;
      font-weight: 600;
      color: var(--danger);
      margin-bottom: 6px;
    }

    .cc-hop__head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .cc-hop__ord { font-family: var(--font-mono); font-size: 13px; color: var(--text-dim); }
    .cc-hop__label { font-size: 14px; font-weight: 600; color: var(--text-muted); }
    .cc-hop__from { font-family: var(--font-mono); font-size: 14px; color: var(--text-dim); }

    .cc-hop__line {
      margin-top: 5px;
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }

    .cc-hop__arrow { font-size: 16px; color: var(--text-dim); }

    .cc-hop__to {
      font-family: var(--font-mono);
      font-size: 17px;
      font-weight: 500;
      word-break: break-all;
    }
    .cc-hop__to--none { color: var(--text-dim); font-weight: 400; }

    /* 🔴 수량 쌍이 선별을 보이게 만드는 유일한 것 — 화살표만 그리면
       「웨이퍼가 통째로 지나갔다」와 화면상 구분되지 않는다. */
    .cc-qty { display: inline-flex; align-items: baseline; gap: 7px; }
    .cc-qty__verb { font-size: 13px; color: var(--text-dim); }

    .cc-qty__rem {
      font-family: var(--font-mono);
      font-size: 14px;
      padding: 2px 9px;
      border-radius: 6px;
      background: var(--overwrite-weak);
      color: var(--overwrite);
      white-space: nowrap;
    }

    .cc-hop__meta {
      margin-top: 5px;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-dim);
      word-break: break-all;
    }

    .cc-hop__reason {
      margin-top: 5px;
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--text-muted);
      word-break: break-word;
    }

    .cc-trace__foot {
      margin-top: 10px;
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--text-muted);
      background: var(--bg-inset);
      border-radius: 8px;
      padding: 8px 12px;
    }

    .cc-trace__terminal {
      margin-top: 8px;
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--text-muted);
      word-break: break-word;
    }

    .cc-notes { display: flex; flex-direction: column; gap: 6px; }

    .cc-note {
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--text-muted);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-left: 5px solid var(--info);
      border-radius: 8px;
      padding: 8px 12px;
    }

    /* ── 통일 팩트 칩 — 세 술어 한 렌더러 ─────────────────────── */
    .cc-facts {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px;
    }

    .cc-fact {
      padding: 11px 13px;
      border-radius: 10px;
      background: var(--bg-inset);
      border: 1px solid var(--border);
      border-left: 5px solid var(--border-strong);
    }
    /* 색만 술어별로 다르고 «구조»는 하나다 — 세 종류를 나란히 읽는 게 목적. */
    .cc-fact--measured { border-left-color: var(--accent); }
    .cc-fact--observed { border-left-color: var(--warning); }
    .cc-fact--processed_with { border-left-color: var(--success); }

    .cc-fact__head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .cc-fact__term { font-size: 13px; font-weight: 600; color: var(--text-dim); }
    .cc-fact__name { font-family: var(--font-mono); font-size: 15px; font-weight: 500; }

    .cc-fact__value {
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .cc-fact__meta { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }

    .cc-fact__q {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-muted);
      background: var(--bg-surface);
      border-radius: 6px;
      padding: 2px 8px;
    }

    /* 관찰자가 «말한» 문장 — 그대로 보이고 절대 파싱하지 않는다. */
    .cc-fact__note {
      margin-top: 7px;
      font-size: 14px;
      line-height: 1.55;
      color: var(--text-muted);
      word-break: break-word;
    }

    .cc-fact__foot {
      margin-top: 8px;
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* 발화자 배지 — 숫자에 붙는 셋 중 하나. 없으면 「출처 미상」이 내용이다. */
    .cc-speaker {
      font-size: 13px;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 6px;
      background: var(--accent-weak);
      color: var(--accent);
    }
    .cc-speaker--unknown { background: var(--info-weak); color: var(--info); }

    .cc-basis {
      font-size: 13px;
      font-weight: 500;
      padding: 2px 9px;
      border-radius: 999px;
      background: var(--bg-surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    /* 위 홉 칩과 같은 신호 — 가정은 점선, 근거는 실선. 한 화면 두 규칙 금지. */
    .cc-basis--convention {
      background: var(--overwrite-weak);
      color: var(--overwrite);
      border: 1px dashed var(--overwrite);
    }

    .cc-evidence { font-family: var(--font-mono); font-size: 13px; color: var(--text-dim); }
    .cc-evidence--none { color: var(--info); }

    .cc-fact__at { font-family: var(--font-mono); font-size: 13px; color: var(--text-dim); }

    /* ── 콘솔의 「답이 아닌 상태」 ─────────────────────────────── */
    .cc-notice {
      padding: 20px 18px;
      border-radius: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
    }
    .cc-notice--error { border-left: 6px solid var(--danger); }
    .cc-notice--busy { border-left: 6px solid var(--accent); }
    .cc-notice--gap { border-left: 6px solid var(--info); }
    .cc-notice--idle { border-left: 6px solid var(--border-strong); }

    .cc-notice__title { font-size: 16px; font-weight: 600; }

    .cc-notice__detail {
      margin-top: 7px;
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--text-muted);
      white-space: pre-line;
      word-break: break-word;
    }

    .cc-generated {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-dim);
      text-align: right;
    }

    /* 두 질문 사이의 경계. 새 모드가 아니라 같은 스크롤의 다음 절이다. */
    /* 🔴 `display: flex`가 [hidden]을 이긴다 — 2026-08-14 실측: 구조·트렌드 뷰에서
       「웨이퍼 혈통」 구분선이 그대로 남아, 아래에 없는 절의 제목이 서 있었다.
       hidden을 세우는 쪽(switchViews)은 멀쩡했고 CSS가 조용히 무시했다. */
    .lt-section-rule[hidden] { display: none; }

    .lt-section-rule {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 6px 0 16px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-dim);
    }
    .lt-section-rule::after {
      content: "";
      flex: 1 1 auto;
      height: 1px;
      background: var(--border);
    }

    @media (prefers-reduced-motion: reduce) {
      .cc-kind:hover { transform: none; }
    }

    /* ══════════════════════════════════════════════════════════
       구조 뷰 (?view=structure) — 유형 수준 온톨로지
       🔴 여기에도 노드/엣지 목록은 없다. 색과 굵기만 정의하고
          무엇을 그릴지는 전부 서버 선언 + 원장 집계에서 나온다.
       🔴 작은 글씨 금지: 이 절의 최소 글자 크기는 13px, 본문은 15px.
          좁은 화면에서 그래프는 «가로 스크롤»하지 글씨를 줄이지 않는다.
       ══════════════════════════════════════════════════════════ */
    .lt-views { display: flex; gap: 4px; padding: 3px; border-radius: 10px; background: var(--bg-inset); }

    .lt-view {
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-dim);
      text-decoration: none;
      white-space: nowrap;
      transition: background 120ms ease, color 120ms ease;
    }

    .lt-view:hover { color: var(--text); background: var(--surface-hover); }
    .lt-view:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--focus-ring); }

    .lt-view--on {
      background: var(--bg-surface);
      color: var(--accent);
      box-shadow: var(--shadow-card);
    }


    /* ══ 놀라움 장치 (?view=surprise) ═══════════════════════════
       화면 ① — 선택기 없는 종합 트렌드표.

       🔴 가독성 = 기능. 표가 넓다고 글씨를 줄이지 않는다 — 값 15px, 분수·배율
          13px, 그 아래는 없다. 넓으면 표가 자기 상자 안에서 «가로 스크롤»한다.
       🔴 조건부서식 램프는 열마다 자기 기저 대비 «배수»다. 단계 넷(주의·높음·
          심각·극단)이 서로 구별돼야 훑기가 성립하므로, 반투명 tint 하나로
          뭉뚱그리지 않고 명시적 램프를 둔다.
       🔴 미검사 칸은 «칠하지 않는다». 0과 같은 칸으로 보이면 이 화면은 거짓말을
          한다. 색이 아니라 상태(data-cell-state)로 갈린다. */
    .sx {
      --sx-h1-bg: #fdf3dd;
      --sx-h2-bg: #fbe1c4;
      --sx-h3-bg: #f6c2ab;
      --sx-h4-bg: #d9604c;
      --sx-h4-fg: #ffffff;
      --sx-band: rgba(26, 102, 208, 0.10);
      display: block;
    }

    :root[data-theme="dark"] .sx {
      --sx-h1-bg: rgba(246, 189, 53, 0.18);
      --sx-h2-bg: rgba(246, 142, 72, 0.26);
      --sx-h3-bg: rgba(248, 126, 126, 0.34);
      --sx-h4-bg: #a33d35;
      --sx-h4-fg: #ffe9e6;
      --sx-band: rgba(84, 194, 245, 0.12);
    }

    .sx-head { margin-bottom: 18px; }
    .sx-head__h { font-size: 23px; font-weight: 650; letter-spacing: -0.015em; }

    .sx-head__sub {
      font-size: 15px;
      color: var(--text-muted);
      margin-top: 6px;
      max-width: 72ch;
    }

    .sx-head__meta { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 14px; }
    .sx-stat { display: flex; align-items: baseline; gap: 6px; }
    .sx-stat__n { font-family: var(--font-mono); font-size: 19px; font-weight: 600; }
    .sx-stat__term { font-size: 13px; color: var(--text-dim); }

    .sx-order { font-size: 13px; color: var(--text-dim); margin-top: 8px; }
    .sx-order--gap { color: var(--warning); }

    .sx-stray {
      font-size: 13px;
      color: var(--warning);
      background: var(--warning-weak);
      border-radius: 8px;
      padding: 7px 11px;
      margin-top: 8px;
    }

    .sx-notice {
      border: 1px solid var(--border);
      border-left: 4px solid var(--text-dim);
      border-radius: 10px;
      padding: 12px 15px;
      margin-bottom: 16px;
      background: var(--bg-surface);
    }
    .sx-notice--gap { border-left-color: var(--warning); background: var(--warning-weak); }
    .sx-notice--error { border-left-color: var(--danger); background: var(--danger-weak); }
    .sx-notice--busy { border-left-color: var(--accent); }
    .sx-notice__title { font-size: 15px; font-weight: 600; }

    .sx-notice__detail {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ── 열 구성 — 전부 앵커. 질문 하나 = URL 하나 ── */
    .sx-cols {
      background: var(--bg-inset);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }

    .sx-cols__row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .sx-cols__row + .sx-cols__row { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
    .sx-cols__term { font-size: 13px; color: var(--text-dim); white-space: nowrap; }
    .sx-cols__none { font-size: 14px; color: var(--text-muted); }

    .sx-colchip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      padding: 5px 6px 5px 13px;
      font-size: 14px;
    }
    .sx-colchip--unknown { border-color: var(--warning); }
    .sx-colchip__warn { font-size: 13px; color: var(--warning); }

    .sx-colchip__drop {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 13px;
      transition: background .15s ease, color .15s ease;
    }
    .sx-colchip__drop:hover { background: var(--danger); color: #fff; }
    .sx-colchip__drop:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus-ring); }

    .sx-coladd {
      font-size: 14px;
      color: var(--accent);
      text-decoration: none;
      border: 1px dashed var(--border-strong);
      border-radius: 999px;
      padding: 5px 13px;
      transition: background .15s ease, border-color .15s ease;
    }
    .sx-coladd:hover { background: var(--accent-weak); border-color: var(--accent); }
    .sx-coladd:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus-ring); }

    .sx-itemchip {
      display: inline-flex;
      align-items: baseline;
      gap: 7px;
      font-size: 14px;
      color: var(--text-muted);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 4px 10px;
    }
    .sx-itemchip__n { font-size: 13px; color: var(--text-dim); font-family: var(--font-mono); }

    /* ── 행 축 선택기: 한 열이 «무엇»인가 ── */
    .sx-axes { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 10px; }
    .sx-axis {
      font-size: 14px; padding: 4px 12px; border-radius: 999px;
      text-decoration: none; color: var(--text-muted);
      background: var(--bg-inset); border: 1px solid var(--border);
    }
    .sx-axis:hover { border-color: var(--accent); color: var(--text); }
    .sx-axis:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus-ring); }
    .sx-axis--on { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); font-weight: 600; }

    /* ══ 표 — 전치됨 ═══════════════════════════════════════════
       🔴 행 = 지표, 열 = 랏 생산 순서, 최신이 오른쪽 (소유자 2026-08-14:
          「상단 트렌드 표는 세로 말고 가로로 리스팅해」). 트렌드는 가로로 읽힌다.

       그래서 이 표에서 «가로 스크롤»은 결함이 아니라 정상 동작이고, 두 축의
       머리는 각자 고정된다 — 랏 머리는 위, 지표 머리는 왼쪽, 모서리는 둘 다.
       랏 100개를 지나가는 동안 무슨 지표인지 계속 보여야 한다.

       🔴 가독성 = 기능: 열을 화면에 «맞추려고» 글씨를 줄이지 않는다. 열은 제
          폭을 갖고 넘치는 만큼 옆으로 흐른다. */
    .sx-tablewrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg-surface);
    }

    .sx-table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 760px; }
    /* width:auto — 100%면 랏 100개가 한 화면에 눌려 들어간다. */
    .sx-table--t { width: auto; min-width: 100%; }

    .sx-th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-strong);
      padding: 9px 12px;
      text-align: right;
      vertical-align: bottom;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }

    /* ── 모서리: 두 축의 이름이 만나는 칸. 가로·세로 둘 다 고정. ── */
    .sx-th--corner {
      left: 0;
      z-index: 4;
      text-align: left;
      vertical-align: bottom;
      border-right: 1px solid var(--border-strong);
    }
    .sx-th__corner-a { display: block; font-size: 15px; font-weight: 700; }
    .sx-th__corner-b { display: block; font-size: 13px; font-weight: 400; color: var(--text-dim); }

    /* ── 랏 열 머리: 마킹 · 랏 · 순번 · 버킷 · 단위 수가 세로로 쌓인다. ── */
    .sx-lotcol {
      text-align: left;
      vertical-align: bottom;
      min-width: 118px;
    }
    .sx-lotcol__mark { display: block; margin-bottom: 4px; cursor: pointer; }
    .sx-lotcol__mark input { width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; }
    .sx-lotcol .sx-lot { display: block; }
    .sx-lotcol__foot { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
    .sx-lotcol__foot .sx-row__seq { margin-left: 0; }
    .sx-lotcol__units {
      display: block;
      margin-top: 3px;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 400;
      color: var(--text-dim);
    }

    /* ── 지표 행 머리: «왼쪽»에 고정. 위가 아니라 왼쪽인 것이 전치의 핵심. ── */
    .sx-th--metric, .sx-th--nocol {
      position: sticky;
      top: auto;
      left: 0;
      z-index: 3;
      text-align: left;
      vertical-align: top;
      white-space: normal;
      border-right: 1px solid var(--border-strong);
      border-bottom: 1px solid var(--border);
    }
    .sx-th--metric { display: table-cell; min-width: 208px; max-width: 300px; }
    .sx-th__metric { display: block; font-size: 15px; font-weight: 650; }
    .sx-th__agg { display: block; font-size: 14px; font-weight: 500; color: var(--text-muted); }
    .sx-th__base { display: block; font-size: 13px; font-weight: 400; color: var(--text-dim); font-family: var(--font-mono); }
    .sx-th__den { display: block; font-size: 13px; font-weight: 400; color: var(--text-dim); }

    /* 🔴 「칠해진 칸 0」·「채점 불가」는 열 머리에 «내용»으로 선다 (R-2026-08-14-G).
       조용한 무색은 「정상」으로 읽힌다 — 가짜 감쇄. 셀마다 반복하면 소음이므로
       지표의 성질은 지표의 자리에. 선언(서버)과 관측(이 응답)은 색으로 갈린다. */
    .sx-th__flag {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--warning);
      background: var(--warning-weak);
      border-radius: 6px;
      padding: 2px 7px;
      margin-top: 4px;
      white-space: normal;
      max-width: 22ch;
    }
    .sx-th__flag--declared { color: var(--danger); background: var(--danger-weak); }

    .sx-facts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    .sx-fact {
      font-size: 13px;
      color: var(--text-muted);
      background: var(--bg-inset);
      border-radius: 999px;
      padding: 3px 11px;
    }
    .sx-fact--warn { color: var(--warning); background: var(--warning-weak); }
    .sx-provnote { font-size: 13px; color: var(--text-dim); margin-top: 6px; max-width: 76ch; }

    /* ── 지표 행 ── */
    .sx-mrow > td, .sx-mrow > th { border-bottom: 1px solid var(--border); padding: 8px 12px; }
    .sx-mrow:nth-child(even) > td { background-image: linear-gradient(var(--row-stripe), var(--row-stripe)); }
    .sx-mrow:hover > td { background-image: linear-gradient(var(--surface-hover), var(--surface-hover)); }

    /* 🔴 마킹은 «흐림이 아니라 강조»다 — 비마킹을 숨기지 않는다(스팟파이어식).
       전치 후 마킹 단위는 «열»이고 CSS엔 열 선택자가 없으므로, 표식은 그 열의
       칸마다 붙는다(surprise_view.js가 data-marked를 칸에 쓴다).

       그리고 칸을 덮지 않고 «양옆 레일»로 표시한다 — 예전처럼 전면을 칠하면
       조건부서식 색을 가려, 마킹한 순간 그 열의 놀라움이 사라진다. */
    .sx-lotcol--marked { background: var(--accent-weak); box-shadow: inset 0 3px 0 0 var(--accent); }
    .sx-cell--marked { box-shadow: inset 2px 0 0 0 var(--accent), inset -2px 0 0 0 var(--accent); }

    .sx-lot {
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--accent);
      text-decoration: none;
    }
    .sx-lot:hover { text-decoration: underline; }
    .sx-lot:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus-ring); border-radius: 4px; }
    .sx-row__seq { font-size: 13px; color: var(--text-dim); margin-left: 7px; font-family: var(--font-mono); }
    .sx-row__chips--none { color: var(--text-dim); font-size: 13px; }

    .sx-bucket {
      display: inline-block;
      font-size: 13px;
      border-radius: 999px;
      padding: 2px 10px;
      background: var(--bg-inset);
      color: var(--text-muted);
      white-space: nowrap;
    }
    .sx-bucket--production { background: var(--success-weak); color: var(--success); }
    .sx-bucket--special_eval { background: var(--warning-weak); color: var(--warning); font-weight: 600; }

    /* ── 칸 ── */
    .sx-cell { text-align: right; white-space: nowrap; vertical-align: top; }
    .sx-cell__v { display: block; font-family: var(--font-mono); font-size: 15px; font-weight: 600; }
    .sx-cell__f { display: block; font-family: var(--font-mono); font-size: 13px; color: var(--text-dim); }
    .sx-cell__lift { display: block; font-size: 13px; color: var(--text-muted); }

    /* 🔴 미검사·미보고·분모없음은 «칠하지 않고» 회색으로 남는다. 0과 다른 칸이다. */
    .sx-cell__v--none { font-weight: 400; color: var(--text-dim); }
    .sx-cell__why { display: block; font-size: 13px; color: var(--text-dim); }
    .sx-cell--unscanned .sx-cell__v--none { font-size: 17px; letter-spacing: 0.1em; }
    .sx-cell--no_denominator .sx-cell__why { color: var(--warning); }
    .sx-cell--unmeasurable .sx-cell__v--none { font-size: 14px; }
    .sx-cell--unreported .sx-cell__v--none { font-size: 14px; color: var(--warning); }

    .sx-cell--h1 { background-color: var(--sx-h1-bg); }
    .sx-cell--h2 { background-color: var(--sx-h2-bg); }
    .sx-cell--h3 { background-color: var(--sx-h3-bg); }
    .sx-cell--h4 { background-color: var(--sx-h4-bg); color: var(--sx-h4-fg); }
    .sx-cell--h4 .sx-cell__f,
    .sx-cell--h4 .sx-cell__lift { color: var(--sx-h4-fg); opacity: 0.85; }

    /* ── 범례 — 행과 다른 data-*(data-heat-key)를 쓴다. 이유는 view 헤더에. ── */
    .sx-legend { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
    .sx-legend__group { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .sx-legend__term { font-size: 13px; color: var(--text-dim); }
    .sx-legend__item { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
    .sx-legend__label { font-size: 13px; }
    .sx-legend__cut, .sx-legend__hint, .sx-legend__src { font-size: 13px; color: var(--text-dim); }

    .sx-legend__swatch {
      display: inline-block;
      width: 13px;
      height: 13px;
      border-radius: 3px;
      border: 1px solid var(--border);
    }
    .sx-legend__item--h1 .sx-legend__swatch { background: var(--sx-h1-bg); }
    .sx-legend__item--h2 .sx-legend__swatch { background: var(--sx-h2-bg); }
    .sx-legend__item--h3 .sx-legend__swatch { background: var(--sx-h3-bg); }
    .sx-legend__item--h4 .sx-legend__swatch { background: var(--sx-h4-bg); }
    .sx-legend__item--unscanned .sx-legend__label { font-family: var(--font-mono); }

    /* ── 절 ── */
    .sx-section { margin-top: 30px; }
    .sx-section__h { font-size: 19px; font-weight: 600; }
    .sx-section__sub { font-size: 14px; color: var(--text-muted); margin-top: 4px; max-width: 72ch; }
    .sx-empty { font-size: 15px; color: var(--text-dim); padding: 14px 0; }
    .sx-generated { font-size: 13px; color: var(--text-dim); font-family: var(--font-mono); text-align: right; margin-top: 20px; }

    /* ── 소형 다중 차트 ── */
    .sx-charts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 18px;
      margin-top: 12px;
    }

    .sx-chart {
      margin: 0;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px 10px;
    }

    .sx-chart__cap { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .sx-chart__title { font-size: 15px; font-weight: 600; }
    .sx-chart__n { font-size: 13px; color: var(--text-dim); font-family: var(--font-mono); white-space: nowrap; }
    .sx-chart__svg { width: 100%; height: 128px; display: block; margin-top: 6px; }
    .sx-chart__none { font-size: 14px; color: var(--text-dim); padding: 22px 0; text-align: center; }
    .sx-chart__band { fill: var(--sx-band); }
    .sx-chart__axis { stroke: var(--border-strong); stroke-width: 1; }
    .sx-chart__event { stroke: var(--warning); stroke-width: 1.5; stroke-dasharray: 3 3; }
    .sx-chart__line { fill: none; stroke: var(--danger); stroke-width: 1.8; opacity: 0.6; }
    .sx-chart__dot { fill: var(--danger); opacity: 0.6; }
    .sx-chart__dot--marked { fill: var(--accent); opacity: 1; stroke: var(--bg-surface); stroke-width: 1.5; }
    .sx-chart__special { fill: var(--warning); }

    .sx-chart__foot { display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; margin-top: 2px; }
    .sx-chart__axislabel, .sx-chart__top, .sx-chart__gaps { font-size: 13px; color: var(--text-dim); }
    .sx-chart__gaps { color: var(--warning); }

    .sx-charts__events { grid-column: 1 / -1; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .sx-charts__term { font-size: 13px; color: var(--text-dim); }
    .sx-eventchip { font-size: 13px; background: var(--warning-weak); color: var(--warning); border-radius: 999px; padding: 3px 11px; }
    .sx-eventchip__off { color: var(--text-dim); margin-left: 6px; }

    /* ── 3축 맵 ──
       🔴 거절된 축은 «숨기지 않는다». 코어축은 오늘 브릿지가 없어 연결 0인데,
          자리를 비우면 읽는 사람은 축이 둘뿐이었다고 읽는다. 자리를 지키고
          이유가 그 자리에 선다. 그리고 «캔버스는 아예 만들지 않는다» —
          그리지 못한 것을 그린 척하는 격자는 이 화면에 존재하지 않는다. */
    .sx-maps { margin-top: 12px; }

    .sx-maprow {
      border-top: 1px solid var(--border);
      padding-top: 14px;
      margin-top: 14px;
    }
    .sx-maprow:first-child { border-top: 0; margin-top: 0; }

    .sx-maprow__head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .sx-maprow__lot { font-family: var(--font-mono); font-size: 16px; font-weight: 600; color: var(--accent); }
    /* 🔴 슬롯 «선택기»는 사라졌다 (소유자 2026-08-14: 슬롯을 요구하지 말고
       걸린 프레임을 전부 그려라). `.sx-slots*`·`.sx-slot*`·`.sx-maprow__slot`·
       `.sx-maprow__hint`가 여기 있었다 — 없어진 기능의 스타일은 남겨 두면
       다음 사람이 되살릴 선택기를 찾게 만든다.

       대신 랏 하나가 프레임 «띠»로 펼쳐진다. 띠는 가로로 흐르고 넘치면
       스크롤한다 — 표와 같은 규율(글씨를 줄이지 않는다). */
    .sx-maprow__note { font-size: 13px; color: var(--text-dim); }
    .sx-maprow__served { font-size: 13px; color: var(--text-muted); font-family: var(--font-mono); }

    .sx-strip { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; }

    .sx-frame {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg-inset);
    }
    .sx-frame__cap { font-family: var(--font-mono); font-size: 14px; color: var(--text-muted); }
    .sx-frame__wafer { display: flex; gap: 12px; flex-wrap: wrap; }
    /* 아직 안 온 프레임은 «빈 자리»로 선다 — 없는 것을 그린 척하지 않는다. */
    .sx-frame__gap {
      font-size: 13px;
      color: var(--text-dim);
      border: 1px dashed var(--border-strong);
      border-radius: 8px;
      padding: 14px 16px;
    }

    /* ══ 대조 패널 — 마킹 여러 개의 «답» ═══════════════════════
       🔴 랏 다섯을 마킹하면 지도 125장·세로 12,283px이 쌓이고 대조는 어디에도
          없었다. 그림 더미는 질문을 웨이퍼마다 한 번씩 다시 말하는 것이지
          답이 아니다. 웨이퍼 하나는 그림이 어울리고, 랏 여럿은 «무엇이 다른가»가
          어울린다.
       🔴 접힘 규율: 후보 목록은 «자기 안에서» 스크롤한다. 페이지를 키우면
          위의 표와 아래의 지도가 둘 다 멀어진다. */
    /* 🔴 우측 고정 패널 — 소유자 2026-08-14: 「대조가 우측 패널에 딱 나오게」.
       표는 가로로 흐르고 답은 옆에 선다. 고정이므로 페이지가 그만큼 자리를
       내준다 — 안 그러면 패널이 «최신 랏»(오른쪽 끝) 위에 앉는다. */
    .sx-section--contrast {
      position: fixed;
      top: 66px;
      right: 0;
      bottom: 0;
      width: 440px;
      z-index: 40;
      overflow-y: auto;
      padding: 16px 18px 24px;
      background: var(--bg-surface);
      border-left: 1px solid var(--border-strong);
      box-shadow: -8px 0 24px -18px rgba(0, 0, 0, .5);
    }
    body.has-contrast main { padding-right: 464px; }

    @media (max-width: 1100px) {
      /* 좁은 화면에선 고정 대신 흐름으로 — 440px를 뺏기면 표가 못 읽힌다.
         문턱이 1280이었을 땐 1256px 창에서 우측 패널이 조용히 사라졌다. */
      .sx-section--contrast {
        position: static; width: auto; border-left: 0;
        border-top: 1px solid var(--border-strong); padding: 16px 0 0; box-shadow: none;
      }
      body.has-contrast main { padding-right: 24px; }
    }

    .cx { display: flex; flex-direction: column; gap: 12px; }

    /* ── A vs B — 표에 이미 있는 숫자, 요청 없이 즉시 ── */
    .cx-pair {
      border: 1px solid var(--accent); border-radius: 12px;
      padding: 12px 14px; background: var(--accent-weak);
    }
    .cx-pair__head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .cx-pair__who { display: flex; align-items: baseline; gap: 6px; }
    .cx-pair__tag {
      font-size: 13px; font-weight: 700; padding: 1px 7px; border-radius: 5px;
      background: var(--accent); color: var(--accent-contrast);
    }
    .cx-pair__lot { font-family: var(--font-mono); font-size: 15px; font-weight: 600; }
    .cx-pair__seq { font-family: var(--font-mono); font-size: 13px; color: var(--text-dim); }
    .cx-pair__vs { font-size: 14px; font-weight: 700; color: var(--text-dim); }

    .cx-pair__table { width: 100%; border-collapse: separate; border-spacing: 0; }
    .cx-pair__row > th, .cx-pair__row > td { padding: 6px 8px; border-top: 1px solid var(--border); }
    .cx-pair__metric { text-align: left; }
    .cx-pair__metricname { display: block; font-size: 14px; font-weight: 600; }
    .cx-pair__metricagg { display: block; font-size: 13px; color: var(--text-muted); }
    .cx-pair__v { text-align: right; font-family: var(--font-mono); font-size: 15px; font-weight: 600; white-space: nowrap; }
    .cx-pair__v--none { font-weight: 400; color: var(--text-dim); font-size: 13px; }
    .cx-pair__verdict { text-align: right; font-size: 13px; font-weight: 600; white-space: nowrap; }
    .cx-pair__verdict--common { color: var(--success); }
    .cx-pair__verdict--differs { color: var(--warning); }
    .cx-pair__verdict--unknown { color: var(--text-dim); font-weight: 500; }

    /* ── 여정 진입로 — 2장 마킹의 «다음 한 걸음» ── */
    .cx-door { margin-top: 10px; }
    .cx-door__go {
      display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
      padding: 9px 12px; border-radius: 9px; text-decoration: none;
      background: var(--accent); color: var(--accent-contrast);
      border: 1px solid var(--accent);
    }
    .cx-door__go:hover { filter: brightness(1.06); }
    .cx-door__go:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus-ring); }
    .cx-door__label { font-size: 15px; font-weight: 700; }
    .cx-door__hint { font-size: 13px; opacity: .9; }
    /* 링크 대신 «왜 없는지» — 422로 보내는 링크는 없느니만 못하다. */
    .cx-door--blocked .cx-door__why {
      display: block; font-size: 13px; color: var(--info);
      background: var(--info-weak); border-radius: 8px; padding: 8px 12px;
    }

    /* 🔴 3개 이상은 «조용히 다른 것»을 하지 않는다 — 그렇다고 말한다. */
    .cx-toomany {
      font-size: 14px; font-weight: 600; color: var(--info);
      background: var(--info-weak); border-left: 4px solid var(--info);
      border-radius: 8px; padding: 10px 14px;
    }
    .cx-head__h { font-size: 18px; font-weight: 700; }
    .cx-head__sub { font-size: 14px; color: var(--text-muted); margin-top: 4px; }
    .cx-head__engine {
      display: inline-block; margin-top: 6px; font-size: 13px;
      font-family: var(--font-mono); color: var(--text-dim);
    }

    .cx-notice { border-radius: 10px; padding: 12px 16px; background: var(--bg-inset); border-left: 4px solid var(--border-strong); }
    .cx-notice--busy { border-left-color: var(--accent); }
    .cx-notice--gap { border-left-color: var(--info); }
    .cx-notice--error { border-left-color: var(--danger); }
    .cx-notice__title { font-size: 15px; font-weight: 600; }
    .cx-notice__detail { margin-top: 5px; font-family: var(--font-mono); font-size: 13px; color: var(--text-muted); white-space: pre-wrap; }

    /* 두 모집단 — 아래 배수는 전부 이 둘의 비다. 분모를 감추지 않는다. */
    .cx-scope { display: flex; gap: 12px; flex-wrap: wrap; }
    .cx-pop {
      display: flex; align-items: baseline; gap: 8px;
      padding: 10px 14px; border-radius: 10px;
      background: var(--bg-inset); border: 1px solid var(--border);
      border-left: 5px solid var(--border-strong);
    }
    .cx-pop--case { border-left-color: var(--accent); }
    .cx-pop--control { border-left-color: var(--text-dim); }
    .cx-pop__term { font-size: 14px; font-weight: 600; color: var(--text-dim); }
    .cx-pop__n { font-family: var(--font-mono); font-size: 20px; font-weight: 600; }
    .cx-pop__unit, .cx-pop__rate { font-size: 14px; color: var(--text-muted); }
    .cx-pop__frac { font-family: var(--font-mono); font-size: 13px; color: var(--text-dim); }

    .cx-scope__excluded { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; width: 100%; }
    .cx-scope__term { font-size: 13px; font-weight: 600; color: var(--warning); }
    .cx-excl {
      display: inline-flex; align-items: baseline; gap: 6px;
      font-size: 13px; padding: 3px 10px; border-radius: 999px;
      background: var(--warning-weak); color: var(--warning);
    }
    .cx-excl__why { color: var(--text-muted); }

    .cx-walk {
      font-size: 13px; color: var(--text-muted);
      background: var(--bg-inset); border-radius: 8px; padding: 7px 12px;
    }

    /* 🔴 잘림은 «내용»이다. 20건을 보여 주고 아무 말 없으면 그게 전부라고 읽힌다. */
    .cx-truncation {
      font-size: 14px; font-weight: 600; color: var(--warning);
      background: var(--warning-weak); border-radius: 8px; padding: 7px 12px;
    }
    .cx-truncation--full { color: var(--text-muted); background: var(--bg-inset); font-weight: 500; }

    .cx-listwrap {
      max-height: 52vh; overflow-y: auto;
      border: 1px solid var(--border); border-radius: 12px;
      background: var(--bg-surface); padding: 4px 10px 10px;
    }

    /* ── 공통점 / 차이점 — 소유자의 낱말 그대로, 각 한 줄 설명 ── */
    .cx-group + .cx-group { margin-top: 14px; }
    .cx-group__h {
      position: sticky; top: 0; z-index: 2;
      display: flex; align-items: baseline; gap: 8px;
      background: var(--bg-surface); padding: 8px 0 4px; margin: 0;
    }
    .cx-group__title { font-size: 15px; font-weight: 700; }
    .cx-group__n { font-family: var(--font-mono); font-size: 13px; color: var(--text-dim); }
    .cx-group--differs .cx-group__title { color: var(--warning); }
    .cx-group--common .cx-group__title { color: var(--success); }
    .cx-group__lead { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }

    /* ── 요인 카드 — 문장이 먼저, 숫자는 아래 보조 ── */
    .cx-cand {
      border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 12px; margin-bottom: 8px; background: var(--bg-inset);
    }
    /* 🔴 이 화면에서 제일 중요한 줄. 작게 쓰지 않는다 — 가독성 = 기능. */
    .cx-cand__say { font-size: 15px; line-height: 1.6; word-break: break-word; }
    .cx-cand__gates { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
    .cx-cand__num {
      display: flex; gap: 12px; flex-wrap: wrap; align-items: baseline;
      margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--border);
    }
    .cx-num { display: inline-flex; align-items: baseline; gap: 5px; }
    .cx-num__term { font-size: 13px; color: var(--text-dim); }
    /* 이름 선언이 없어 전선 철자가 그대로 나온 행 — 조용히 영어가 되지 않게. */
    .cx-rawname {
      display: inline-block; margin-top: 6px; font-size: 13px; font-weight: 600;
      padding: 1px 7px; border-radius: 5px; background: var(--info-weak); color: var(--info);
    }
    .cx-about { font-size: 13px; padding: 1px 7px; border-radius: 5px; background: var(--accent-weak); color: var(--accent); }
    .cx-evidence { font-size: 13px; color: var(--text-dim); font-family: var(--font-mono); }

    .cx-rate { font-family: var(--font-mono); font-size: 15px; font-weight: 600; }
    .cx-frac { font-family: var(--font-mono); font-size: 13px; color: var(--text-dim); }

    .cx-lift {
      display: inline-block; font-family: var(--font-mono); font-size: 15px; font-weight: 700;
      padding: 2px 9px; border-radius: 6px; background: var(--bg-inset); color: var(--text-muted);
    }
    .cx-lift--enriched { background: var(--warning-weak); color: var(--warning); }
    .cx-lift--depleted { background: var(--info-weak); color: var(--info); }
    .cx-lift--flat { background: var(--bg-inset); color: var(--text-dim); }
    .cx-lift--undeterminable { background: var(--bg-inset); color: var(--info); }
    .cx-lift__word { font-size: 13px; color: var(--text-muted); }
    /* 구간은 점추정과 «함께» 읽힌다 — 최상위 후보엔 점추정이 아예 없다. */
    .cx-ci { font-family: var(--font-mono); font-size: 13px; color: var(--text-dim); }

    .cx-gate {
      display: inline-flex; align-items: baseline; gap: 4px;
      font-size: 13px; padding: 2px 8px; border-radius: 999px; margin: 0 4px 4px 0;
      background: var(--bg-inset); color: var(--text-muted); border: 1px solid var(--border);
    }
    .cx-gate--pass { background: var(--success-weak); color: var(--success); border-color: transparent; }
    .cx-gate--fail { background: var(--danger-weak); color: var(--danger); border-color: transparent; }
    /* 🔴 미판정은 «불통과가 아니다» — 실선 아닌 점선, 오류색 아닌 중립색. */
    .cx-gate--unknown { border-style: dashed; color: var(--text-dim); }
    .cx-gate__glyph { font-weight: 700; }
    .cx-biasflag { display: inline-block; font-size: 13px; padding: 2px 8px; border-radius: 5px; background: var(--overwrite-weak); color: var(--overwrite); }

    .cx-legend { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
    .cx-legend__term { font-size: 13px; font-weight: 600; color: var(--text-dim); }
    .cx-legend__item { display: inline-flex; align-items: baseline; gap: 6px; font-size: 13px; }
    .cx-legend__label { font-weight: 600; }
    .cx-legend__doc { color: var(--text-dim); }
    .cx-legend__hint { font-size: 13px; color: var(--text-muted); width: 100%; }

    .cx-fields { font-size: 14px; }
    .cx-fields__sum { cursor: pointer; font-size: 14px; color: var(--text-muted); padding: 6px 0; }
    .cx-fields__list { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; max-height: 30vh; overflow-y: auto; }
    .cx-field { display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; padding: 6px 10px; border-radius: 7px; background: var(--bg-inset); }
    /* 귀속 0인 필드는 순위에 «기여하지 못했다» — 없는 것과 다르다. */
    .cx-field--blind { border: 1px dashed var(--info); background: transparent; }
    .cx-field__name { font-family: var(--font-mono); font-size: 14px; }
    .cx-field__cov { font-family: var(--font-mono); font-size: 13px; color: var(--text-dim); }
    .cx-field__flag { font-size: 13px; color: var(--info); font-weight: 600; }
    .cx-field__note { font-size: 13px; color: var(--text-muted); }

    .cx-empty { font-size: 14px; color: var(--text-dim); }
    .cx-note { font-size: 13px; color: var(--text-muted); background: var(--bg-inset); border-radius: 8px; padding: 7px 12px; }
    .cx-generated { font-family: var(--font-mono); font-size: 13px; color: var(--text-dim); text-align: right; }

    .sx-maprow__panels { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; }

    .sx-map {
      margin: 0;
      width: 210px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 12px;
    }
    /* 거절은 «옅게»가 아니라 «사실»로 — 구조 뷰의 「선언만」 규칙과 같다.
       흐리게 하면 「덜 중요함」이라 말하게 되는데, 읽는 사람이 여기 온 이유가
       바로 이 축일 수 있다. */
    .sx-map--refused { border-style: dashed; }
    .sx-map--unreachable { border-color: var(--warning); }

    .sx-map__cap { display: flex; flex-direction: column; gap: 2px; }
    .sx-map__axis { font-size: 15px; font-weight: 600; }
    .sx-map__hint { font-size: 13px; color: var(--text-dim); }

    .sx-map__canvas {
      width: 176px;
      height: 176px;
      display: block;
      margin: 10px auto 8px;
      background: var(--bg-inset);
      border-radius: 6px;
    }

    .sx-map__why { font-size: 14px; color: var(--warning); margin-top: 10px; }
    .sx-map--unreachable .sx-map__why { font-weight: 600; }
    .sx-map__detail { font-size: 13px; color: var(--text-dim); font-family: var(--font-mono); margin-top: 4px; word-break: break-all; }

    .sx-map__foot { display: flex; gap: 12px; flex-wrap: wrap; }
    .sx-map__stat { display: flex; align-items: baseline; gap: 4px; }
    .sx-map__statn { font-family: var(--font-mono); font-size: 15px; font-weight: 600; }
    .sx-map__statterm { font-size: 13px; color: var(--text-dim); }
    .sx-map__off { font-size: 13px; color: var(--warning); }
    .sx-map__prov { font-size: 13px; color: var(--text-dim); margin-top: 7px; word-break: break-word; }

    @media (max-width: 820px) {
      .sx-charts { grid-template-columns: 1fr; }
      .sx-head__h { font-size: 21px; }
    }

    /* ── 랏 참조뷰 (화면 ②, ?view=lot) ────────────────────────────
       🔴 가독성 = 기능. 이 화면은 「이 랏이 왜 이상한가」를 사람이 읽고 판단하는
          자리다. 본문 15px · 관문 라벨 14px · 메타 13px — 그 아래로 내리지 말 것.
       🔴 세 관문의 시각 언어는 «셋»이다. 통과(초록 채움) · 불통과(빨강 테두리) ·
          미판정(점선 회색). 미판정을 불통과의 옅은 버전으로 그리면 이 화면이
          만들어야 할 산출물(DOE 후보)이 사라진다. */
    .lr { max-width: 1080px; margin: 0 auto; padding: 22px 24px 60px; }

    .lr-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      margin-top: 16px;
      box-shadow: var(--shadow-card);
    }

    .lr-panel__head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .lr-panel__title { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
    .lr-panel__sub { font-size: 14px; color: var(--text-dim); }

    /* ① 헤더 */
    .lr-head {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: var(--shadow-card);
    }

    .lr-head__line { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .lr-head__lot { font-family: var(--font-mono); font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
    .lr-head__slot { font-family: var(--font-mono); font-size: 16px; color: var(--text-muted); }
    .lr-head__kind {
      font-size: 14px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
      background: var(--accent-2-weak); color: var(--accent-2);
    }

    .lr-head__link {
      font-size: 15px; font-weight: 600; color: var(--accent); text-decoration: none;
      padding: 5px 12px; border-radius: 8px; border: 1px solid transparent;
      transition: background 120ms ease, border-color 120ms ease;
    }
    .lr-head__link:hover { background: var(--accent-weak); border-color: var(--accent); }
    .lr-head__line .lr-head__link { margin-left: auto; }

    .lr-head__mismatch {
      margin-top: 10px; font-size: 15px; font-weight: 600;
      color: var(--danger); background: var(--danger-weak);
      border-radius: 8px; padding: 8px 12px;
    }

    .lr-head__meta { margin-top: 12px; font-size: 13px; color: var(--text-dim); font-family: var(--font-mono); }

    .lr-bucket {
      font-size: 14px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
      background: var(--bg-inset); color: var(--text-muted); border: 1px solid var(--border);
    }
    .lr-bucket--special_eval { background: var(--warning-weak); color: var(--warning); border-color: var(--warning); }
    .lr-bucket--absent { background: transparent; color: var(--text-dim); border-style: dashed; }
    .lr-bucket__off { font-size: 14px; font-weight: 600; color: var(--warning); }

    .lr-stats { display: flex; gap: 26px; flex-wrap: wrap; margin-top: 16px; }
    .lr-stat { display: flex; flex-direction: column; gap: 3px; }
    .lr-stat__term { font-size: 14px; color: var(--text-dim); }
    .lr-stat__note { font-size: 13px; color: var(--text-dim); }

    .lr-cov { display: flex; gap: 16px; flex-wrap: wrap; align-items: baseline; margin-top: 14px; }
    .lr-cov__term { font-size: 14px; font-weight: 600; color: var(--text-muted); }
    .lr-cov__all, .lr-cov__axis { display: inline-flex; align-items: baseline; gap: 6px; }
    .lr-cov__axisterm { font-size: 14px; color: var(--text-dim); }

    /* 「서버가 말하지 않았다」 — 오류 상자가 아니라 내용 */
    .lr-gap {

      padding: 11px 14px;
      margin-top: 10px;

    .lr-gap__title { font-size: 16px; font-weight: 600; color: var(--info); }

    .lr-empty { font-size: 15px; color: var(--text-dim); }
    .lr-note { margin-top: 12px; font-size: 14px; color: var(--text-muted); }

    /* ② 혈통 요약 */
    .lr-anom { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    .lr-anom__none { font-size: 15px; color: var(--text-dim); }
    .lr-anom__badge {
      display: inline-flex; align-items: baseline; gap: 7px;
      font-size: 14px; font-weight: 600; padding: 5px 12px; border-radius: 999px;
      background: var(--warning-weak); color: var(--warning); border: 1px solid var(--warning);

    .lr-anom__badge--info { background: var(--info-weak); color: var(--info); border-color: var(--info); }
    .lr-anom__badge--high, .lr-anom__badge--severe {
      background: var(--danger-weak); color: var(--danger); border-color: var(--danger);

    .lr-anom__badge--plain { background: var(--bg-inset); color: var(--text-muted); border-color: var(--border); }
    .lr-anom__detail { font-family: var(--font-mono); font-size: 13px; font-weight: 500; opacity: 0.85; }

    .lr-lineage__subject { font-family: var(--font-mono); font-size: 15px; color: var(--text-muted); margin-bottom: 10px; }
    .lr-lineage__foot { margin-top: 12px; font-size: 14px; color: var(--text-muted); font-family: var(--font-mono); }
    .lr-lineage__terminal {
      margin-top: 8px; font-size: 14px; color: var(--info);
      background: var(--info-weak); border-radius: 8px; padding: 8px 12px;

    /* ③ 차이점 순위표 — 세 관문 */
    .lr-legend {
      display: flex; gap: 16px; flex-wrap: wrap; align-items: center;

    .lr-legend__item--pass .lr-legend__glyph { color: var(--success); }
    .lr-legend__item--fail .lr-legend__glyph { color: var(--danger); }
    .lr-legend__item--unknown .lr-legend__glyph { color: var(--text-dim); }
    .lr-legend__note { font-size: 14px; color: var(--warning); font-weight: 600; }

    .lr-table { width: 100%; border-collapse: collapse; }
    .lr-th {
      text-align: left; font-size: 14px; font-weight: 600; color: var(--text-dim);
      padding: 8px 10px; border-bottom: 2px solid var(--border);

    .lr-th--gate { text-align: center; }
    .lr-cell { padding: 11px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 15px; }

    .lr-row__why .lr-cell { border-top: 0; }

    .lr-factor { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }

    .lr-factor__key { font-family: var(--font-mono); font-size: 15px; font-weight: 600; }
    .lr-family {
      font-size: 13px; font-weight: 600; padding: 2px 9px; border-radius: 999px;
      background: var(--bg-inset); color: var(--text-muted); border: 1px solid var(--border);

    .lr-family--gap { background: var(--danger-weak); color: var(--danger); border-color: var(--danger); }
    .lr-about {
      font-size: 13px; font-weight: 600; padding: 2px 9px; border-radius: 999px;

    .lr-gate {

      font-size: 14px; font-weight: 600; padding: 4px 11px; border-radius: 999px;
      border: 1px solid transparent;

    .lr-gate__glyph { font-family: var(--font-mono); font-size: 15px; font-weight: 700; }
    .lr-gate--pass { background: var(--success-weak); color: var(--success); border-color: var(--success); }
    .lr-gate--fail { background: transparent; color: var(--danger); border-color: var(--danger); }
    .lr-gate--unknown {
      background: transparent; color: var(--text-dim);
      border-color: var(--border-strong); border-style: dashed;
    }
    .lr-gate__flag {
      font-size: 13px; font-weight: 600; color: var(--warning);
      background: var(--warning-weak); border-radius: 999px; padding: 1px 8px;
    }

    /* ④ 조사 이력 */
    .lr-none { font-size: 17px; font-weight: 600; color: var(--text-muted); }
    .lr-none__why { margin-top: 5px; font-size: 14px; color: var(--text-dim); }
    .lr-log { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .lr-log__item {
      background: var(--bg-inset); border-left: 3px solid var(--border-strong);
      border-radius: 8px; padding: 12px 14px;
    }
    .lr-log__item--open { border-left-color: var(--warning); }
    .lr-log__item--closed { border-left-color: var(--success); }
    .lr-log__head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
    .lr-log__kind { font-size: 14px; font-weight: 700; color: var(--text-muted); }
    .lr-log__state { font-size: 14px; font-weight: 600; color: var(--accent); }
    .lr-log__at { font-family: var(--font-mono); font-size: 13px; color: var(--text-dim); }
    .lr-log__q { margin-top: 6px; font-size: 15px; }
    .lr-log__a { margin-top: 6px; font-size: 15px; color: var(--success); font-weight: 600; }
    .lr-log__a--open { color: var(--text-dim); font-weight: 500; }
    .lr-log__reissue { display: inline-block; margin-top: 6px; font-size: 13px; color: var(--warning); font-weight: 600; }

    .lr-notice {
      border-radius: 10px; padding: 12px 16px; margin-bottom: 14px;
      background: var(--bg-inset); border-left: 3px solid var(--border-strong);
    }
    .lr-notice--gap { background: var(--info-weak); border-left-color: var(--info); }
    .lr-notice--error { background: var(--danger-weak); border-left-color: var(--danger); }
    .lr-notice--busy { background: var(--accent-weak); border-left-color: var(--accent); }
    .lr-notice__title { font-size: 16px; font-weight: 600; }
    .lr-notice__detail { margin-top: 5px; font-size: 14px; color: var(--text-muted); font-family: var(--font-mono); word-break: break-word; }

    .lr-foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 20px; }
    .lr-foot__self {
      margin-left: auto; font-family: var(--font-mono); font-size: 13px;
      color: var(--text-dim); text-decoration: none;
    }
    .lr-foot__self:hover { color: var(--accent); }

    @media (max-width: 820px) {
      .lr { padding: 16px 14px 48px; }
      .lr-head__lot { font-size: 22px; }
      .lr-table { display: block; overflow-x: auto; }
    }

<body>
  <header class="lt-app-header">
    <div class="lt-app-header__inner">
      <div class="lt-title">
        🧬 원장 혈통 추적
        <span class="lt-title__sub">이 웨이퍼는 어디서 왔나</span>
      </div>
      <div class="lt-ask">
        <input id="lt-query" type="text" autocomplete="off" spellcheck="false"
          placeholder="랏 또는 랏/슬롯" aria-label="추적할 랏 또는 랏/슬롯" />
        <span class="lt-ask__hint">Enter</span>
      </div>
      <!-- 🔴 질문 하나 = URL 하나. 탭이 아니라 링크 두 개 — 상태 없음, 복사 가능. -->
      <nav class="lt-views" aria-label="화면">
        <a class="lt-view" data-view-link="ask" href="?">조사</a>
        <a class="lt-view" data-view-link="surprise" href="?view=surprise">트렌드</a>
        <!-- 랏 참조뷰는 랏이 있어야 성립한다 — 링크는 랏 없는 안내 상태로 들어가고,
             실제 진입은 트렌드 표의 랏에서 온다. -->
        <a class="lt-view" data-view-link="lot" href="?view=lot">랏 참조</a>
        <a class="lt-view" data-view-link="structure" href="?view=structure">구조</a>
      </nav>
      <a class="lt-home" href="/index.html">← 그리드</a>
    </div>
  </header>

  <main>
    <!-- 🔴 한 페이지, 두 질문. 새 페이지도 새 모드도 아니고 같은 스크롤의 두 절이다.
         위: 「이 불량은 얼마나 나고, 난 쪽과 안 난 쪽이 뭐가 다른가」 (케이스-컨트롤 콘솔)
         아래: 「이 웨이퍼는 어디서 왔나」 (혈통 추적 — 원래 있던 그 화면, 그대로)
         콘솔의 조작은 전부 앵커라 이 페이지의 폼 컨트롤은 여전히 위쪽 랏 상자 하나뿐. -->
    <!-- 🔴 셋째 질문: 「이 원장은 어떤 구조인가」 (?view=structure).
         유형 수준 그래프 — 히스토리 그래프가 아니다. 선언(어휘 시그니처)과
         원장 집계(GROUP BY 주어유형·술어·목적어종류)에서 «생성»되고, 이 파일에도
         소스에도 노드/엣지 목록은 없다. -->
    <!-- 🔴 넷째 질문: 「지금 이상한 랏이 있는가」 (?view=surprise) — 놀라움 장치.
         선택기가 없다. 행 = 선언된 지표 전부, 열 = 랏 생산 순서(최신이 오른쪽),
         조건부서식은 지표(항목) 축으로 — 트렌드는 가로로 읽힌다(소유자 2026-08-14).
         열 구성 {항목 × 집계}는 URL에 실리고, 지표 목록은
         이 파일에도 소스에도 없다 — 서버 선언에서 나온다. -->
    <!-- 🔴 다섯째 질문: 「이 랏은 왜 이상한가」 (?view=lot&lot=…) — 랏 참조뷰(화면 ②).
         네 구역이 추론 순서다: 헤더(랏·버킷·요약 숫자·구조 뷰 링크) → 혈통 요약
         (걷기 산출 + 경로 특이점 뱃지 + 홉 basis) → 차이점 순위표(세 관문) →
         조사 이력. 데이터 없는 구역도 «문장으로» 서 있고 숨지 않는다. -->
    <div id="lt-surprise" hidden></div>
    <div id="lt-lot" hidden></div>
    <div id="lt-structure" hidden></div>
    <!-- 🔴 여정 대조(?view=journey&scope=wafer:A,B) — 웨이퍼 «2장»이 어디까지
         같은 길이었고 어디서 갈라졌는가. 상단 내비에 링크가 «없다»: 이 화면은
         트렌드 표에서 웨이퍼 두 장을 마킹하는 몸짓으로 들어오는 곳이라,
         빈 스코프로 들어가는 링크는 답이 없는 주소를 하나 더 만들 뿐이다. -->
    <div id="lt-journey" hidden></div>
    <div id="lt-console"></div>
    <div class="lt-section-rule">웨이퍼 혈통</div>
    <div id="lt-result"></div>
  </main>
