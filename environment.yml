name: assy_manager
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - fastapi
  - uvicorn
  - sqlalchemy
  - pydantic
  - websockets
  - python-dotenv
  - pyside6
  - watchdog
  # Process-tree inspection for the launcher's supervisor. Windows
  # TerminateProcess does not walk the tree, so without psutil a stopped child
  # leaves its own subprocesses (auto-update collector scripts) orphaned.
  - psutil
  - pytest
  - httpx
  - pyinstaller
  - pip
  - pip:
    - neo4j
    - beautifulsoup4

