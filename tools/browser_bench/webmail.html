<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Webmail</title>
<link rel="stylesheet" href="/bench.css">
</head>
<body>
<h1>Inbox</h1>
<div id="mail">
  <div id="mail-list"><div id="mail-items"></div><div id="list-status">Loading...</div></div>
  <div id="reader-shell">
    <div id="reader-wrap">
      <div id="reader" class="hide-height">
        <h2 class="reader-subject">Welcome to Webmail</h2>
        <p><span class="reader-from">admin@bench.test</span> <span class="reader-date">2026-11-01 09:00</span>
           <span class="reader-id">0</span></p>
        <div class="reader-body">This pane is in the page from the start, hidden.</div>
        <button id="reader-close">Close</button>
      </div>
    </div>
  </div>
</div>
<script src="/webmail.js"></script>
</body>
</html>
